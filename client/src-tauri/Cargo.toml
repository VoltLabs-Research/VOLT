[package]
name = "volt-client"
version = "0.1.0"
description = "Volt desktop client"
authors = ["Volt Labs <support@voltlabs.io>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
