name: General Issue
description: Bug, improvement, or technical task
title: "[ISSUE] "
labels: []
assignees: []

body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Brief context for this issue.
      placeholder: Why does this issue exist?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Goal
      description: Clearly describe what is wrong or what you want to achieve.
      placeholder: Describe the main problem or goal.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope / Steps
      description: List steps, subtasks, or scope of work.
      placeholder: |
        - Step 1
        - Step 2
        - Step 3
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should happen when this is done?
      placeholder: Describe the desired outcome.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result (if applicable)
      description: What happens currently?
      placeholder: Describe the current behavior.
    validations:
      required: false

  - type: textarea
    id: technical
    attributes:
      label: Technical Notes
      description: Files involved, hypotheses, constraints, implementation notes.
      placeholder: |
        - Files:
        - Suspected cause:
        - Proposed approach:
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, commits, docs, links.
    validations:
      required: false

  - type: checkboxes
    id: done
    attributes:
      label: Done Criteria
      options:
        - label: Implementation completed
        - label: Tests passing and/or added
        - label: Documentation updated (if applicable)
