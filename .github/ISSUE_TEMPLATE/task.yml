name: Task
description: Technical task, refactor, maintenance, or investigation
title: "Task: "
labels: ["chore"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Done criteria
      placeholder: |
        - [ ] Implementation completed
        - [ ] Tests passing and/or added
        - [ ] Documentation updated (if applicable)
    validations:
      required: false
