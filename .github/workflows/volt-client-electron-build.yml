name: Volt Client Electron Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-electron-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-electron-build.yml'
  workflow_dispatch:

concurrency:
  group: volt-client-electron-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Electron artifacts (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact_name: volt-electron-linux
            artifact_path: |
              client/release/*.AppImage
              client/release/*.deb
              client/release/*.yml
          - os: windows-latest
            label: windows
            artifact_name: volt-electron-windows
            artifact_path: |
              client/release/*.exe
              client/release/*.blockmap
              client/release/*.yml
          - os: macos-latest
            label: macos
            artifact_name: volt-electron-macos
            artifact_path: |
              client/release/*.dmg
              client/release/*.zip
              client/release/*.blockmap
              client/release/*.yml
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: https://example.invalid
      VITE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-20-client-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-client-npm-

      - name: Install client dependencies
        run: npm ci

      - name: Build Electron desktop artifacts
        run: npm run build-electron

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
