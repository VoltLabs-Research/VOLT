name: Desktop CLI Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-cli:
    name: Build & attach cli.cjs
    # Releases here cover other products too, so only desktop `v*` tags attach
    # assets. `voltsdk-*` tags also start with `v`, hence the second clause.
    if: >
      startsWith(github.event.release.tag_name, 'v') &&
      !startsWith(github.event.release.tag_name, 'voltsdk-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `@volt/contracts` is a dev dependency (it is bundled, never loaded at runtime),
      # so this installs dev dependencies too; the CLI does not need Electron itself.
      - name: Install desktop dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --filter volt-desktop...

      - name: Build CLI bundle
        run: pnpm run cli:build

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/cli.cjs stack/compose.yml --repo "${{ github.repository }}" --clobber
