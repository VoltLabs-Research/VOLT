name: Publish Ubuntu Remote Desktop Full Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ubuntu-remote-desktop-full.yml'
      - 'image-contexts/ubuntu-remote-desktop-full/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/voltlabs-research/volt-ubuntu-remote-desktop-full

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-{{sha}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./image-contexts/ubuntu-remote-desktop-full
          file: ./image-contexts/ubuntu-remote-desktop-full/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo '## Ubuntu Remote Desktop Full image published'
            echo ''
            echo '- Image: `${{ env.IMAGE_NAME }}`'
            echo '- Tags: `main`, `sha-${{ github.sha }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
