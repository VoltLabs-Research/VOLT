name: Deploy Volt Server to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'Volt/server/**'
      - '.github/workflows/deploy-volt-server.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24.x'
  SERVER_WORKDIR: 'Volt/server'
  SERVER_RELEASE_DIR: '.azure/volt-server-release'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Volt/server/package-lock.json

      - name: Install and build Volt/server
        working-directory: ${{ env.SERVER_WORKDIR }}
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          rm -rf "${{ env.SERVER_RELEASE_DIR }}"
          mkdir -p "${{ env.SERVER_RELEASE_DIR }}/storage/temp"
          cp "${{ env.SERVER_WORKDIR }}/package.json" "${{ env.SERVER_RELEASE_DIR }}/package.json"
          cp "${{ env.SERVER_WORKDIR }}/package-lock.json" "${{ env.SERVER_RELEASE_DIR }}/package-lock.json"
          cp -R "${{ env.SERVER_WORKDIR }}/dist" "${{ env.SERVER_RELEASE_DIR }}/dist"
          cp -R "${{ env.SERVER_WORKDIR }}/static" "${{ env.SERVER_RELEASE_DIR }}/static"

      - name: Install production dependencies
        working-directory: ${{ env.SERVER_RELEASE_DIR }}
        run: npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Volt/server
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_VOLT_SERVER }}
          package: ${{ env.SERVER_RELEASE_DIR }}
          startup-command: node dist/src/server.js
