name: Volt Client Tauri Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-tauri-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-tauri-build.yml'
  workflow_dispatch:

concurrency:
  group: volt-client-tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Tauri artifacts (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact_name: volt-tauri-linux
            artifact_path: |
              client/src-tauri/target/release/bundle/appimage/*.AppImage
              client/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            label: windows
            artifact_name: volt-tauri-windows
            artifact_path: |
              client/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            label: macos
            artifact_name: volt-tauri-macos
            artifact_path: |
              client/src-tauri/target/release/bundle/dmg/*.dmg
    defaults:
      run:
        working-directory: client
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_API_URL: https://example.invalid
      VITE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install client dependencies
        run: npm ci

      - name: Build Tauri desktop artifacts
        run: npm run tauri:build

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
