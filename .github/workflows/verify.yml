name: Verify

# The checks that stand in for a test suite.
#
# `.agents/testing.md` states this repo deliberately has no tests, and names
# typecheck + layering + lint + the client build as the substitute.
# Until now none of them ran in CI: the other workflows only built and published,
# so a broken typecheck or a new layering violation reached an image unchallenged.
#
# `@volt/contracts` has no toolchain of its own by design; it is compiled from
# source by its consumers, so their typechecks and the client build are what verify it.
#
# Each job installs only its package and the workspace packages it depends on
# (`--filter <name>...`), then builds those dependencies (`<name>^...`): the SDKs'
# package.json types point at dist/.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter volt-server...

      - name: Build workspace dependencies
        run: pnpm --filter "volt-server^..." build

      - name: Typecheck
        run: pnpm --filter volt-server typecheck

      - name: Lint
        run: pnpm --filter volt-server lint

      # Fails on any layering rule error, and on growth of the debt pinned in
      # depcruise-baseline.json (lower it with `pnpm run layering:update`).
      - name: Layering
        run: pnpm --filter volt-server layering

      # `tspc` applies typia's transform; the build is what proves it still runs.
      - name: Build
        run: pnpm --filter volt-server build

  cluster:
    name: Cluster daemon
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The install builds native modules (duckdb, canvas), so the toolchain has to
      # be present before install rather than after.
      - name: Install build toolchain for native modules
        uses: ./.github/actions/native-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cluster-daemon...

      - name: Build workspace dependencies
        run: pnpm --filter "cluster-daemon^..." build

      - name: Typecheck
        run: pnpm --filter cluster-daemon typecheck

      - name: Lint
        run: pnpm --filter cluster-daemon lint

      # Fails on any layering rule error, and on growth of the debt pinned in
      # depcruise-baseline.json (lower it with `pnpm run layering:update`).
      - name: Layering
        run: pnpm --filter cluster-daemon layering

      - name: Build
        run: pnpm --filter cluster-daemon build

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The client ships @volt/web-runtime, which bundles the server and the cluster
      # daemon: installing them builds the daemon's native modules, and the runtime
      # compiles its native addons to WebAssembly with Emscripten.
      - name: Install build toolchain for native modules
        uses: ./.github/actions/native-toolchain

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter volt-webapp...

      - name: Build workspace dependencies
        run: pnpm --filter "volt-webapp^..." build

      - name: Lint
        run: pnpm --filter volt-webapp lint

      - name: Typecheck the web runtime
        run: pnpm --filter @volt/web-runtime typecheck

      # The runtime's smoke pages in headless Chrome: Node's platform in a worker, the
      # Node programs a backend spawns, the whole local stack provisioned, and python3
      # (venv, pip, stdio).
      - name: Smoke-test the web runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for page in page programs stack python; do
            pnpm --filter @volt/web-runtime smoke "$page"
          done

      # `tsc -b` then `vite build`: the only check that catches a bundler-level
      # break, and it typechecks `@volt/contracts` from source.
      - name: Build
        run: pnpm --filter volt-webapp build

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          electron_config_cache: ${{ github.workspace }}/.cache/electron
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --filter volt-desktop...; then
              exit 0
            fi
            echo "pnpm install failed (attempt ${attempt}/3)"
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      # @volt/contracts reads its daemon runtime types from the SDK's built declarations.
      - name: Build workspace dependencies
        run: pnpm --filter "volt-desktop^..." build

      - name: Typecheck
        run: pnpm --filter volt-desktop typecheck

      - name: Lint
        run: pnpm --filter volt-desktop lint

      # Catches a break in the main and preload bundles without packaging
      # installers, which the release workflow already does per OS.
      - name: Build
        run: pnpm --filter volt-desktop build

      # The CLI is shipped as a release asset, so its bundle has to keep resolving
      # `@volt/contracts` from the workspace.
      - name: Build CLI bundle
        run: pnpm --filter volt-desktop cli:build

  stack:
    name: Stack compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Both shapes have to stay valid: the base file builds from source, and the
      # overlay swaps in the published images. A typo in either only shows up on a
      # user's first launch otherwise.
      - name: Validate compose (build from source)
        working-directory: packages/apps/desktop/stack
        env:
          VOLT_SOURCE_DIR: /tmp/volt-source
          TEAM_CLUSTER_ID: validation
        run: |
          mkdir -p "$VOLT_SOURCE_DIR"
          docker compose -f compose.yml --profile enrolled config > /dev/null

      - name: Validate compose (prebuilt images)
        working-directory: packages/apps/desktop/stack
        env:
          VOLT_SOURCE_DIR: /tmp/volt-source
          TEAM_CLUSTER_ID: validation
        run: |
          docker compose -f compose.yml -f compose.images.yml --profile enrolled config > /dev/null

      # The overlay is only useful if it actually replaces every build.
      - name: Assert the overlay leaves no build step
        working-directory: packages/apps/desktop/stack
        env:
          VOLT_SOURCE_DIR: /tmp/volt-source
          TEAM_CLUSTER_ID: validation
        run: |
          set -uo pipefail
          builds="$(docker compose -f compose.yml -f compose.images.yml --profile enrolled config \
            | grep -cE '^[[:space:]]+build:' || true)"
          echo "build blocks with the overlay applied: $builds"
          if [ "$builds" -ne 0 ]; then
            echo "::error::compose.images.yml left $builds build block(s); every prebuilt service must set build to null."
            exit 1
          fi
