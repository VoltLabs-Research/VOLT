name: Verify

# The checks that stand in for a test suite.
#
# Until now the only workflows here built and pushed Docker images, so a broken
# typecheck or a new layering violation reached a published image unchallenged.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, layering, module boot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` builds native modules (duckdb, canvas), so the toolchain has to be
      # present before install rather than after.
      - name: Install build toolchain for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            zstd

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Proves the DAEMON_MODULES toggle and the requires-closure still resolve.
      - name: Module boot smoke
        run: npm run smoke:modules

      # Fails only on an `error`-severity rule; `no-cross-module-imports` and
      # `no-circular` are `warn` with known debt, which the ratchet below bounds.
      - name: Layering rules
        run: npm run depcruise

      - name: Layering debt ratchet
        env:
          # Baseline measured on the commit that introduced this workflow. Lower it
          # when you remove violations; raising it needs a reason in the PR.
          MAX_VIOLATIONS: 65
        run: |
          set -uo pipefail
          output="$(npm run --silent depcruise 2>&1 || true)"
          count="$(printf '%s' "$output" | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -oE '^x [0-9]+ dependency violations' | grep -oE '[0-9]+' | head -1)"

          if [ -z "$count" ]; then
            echo "Could not read the violation count from depcruise output:"
            printf '%s\n' "$output" | tail -20
            exit 1
          fi

          echo "dependency violations: $count (max $MAX_VIOLATIONS)"
          if [ "$count" -gt "$MAX_VIOLATIONS" ]; then
            echo "::error::Layering debt grew from $MAX_VIOLATIONS to $count. Route the new edge through @shared/contracts instead of adding to the debt."
            exit 1
          fi

      - name: Build
        run: npm run build
