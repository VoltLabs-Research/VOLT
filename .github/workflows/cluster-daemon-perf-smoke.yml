name: ClusterDaemon Perf Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/cluster-daemon-perf-smoke.yml'
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/cluster-daemon-perf-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Perf smoke placeholder
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run perf smoke placeholder
        run: npm run perf:smoke

      - name: Capture baseline placeholder
        run: npm run perf:baseline
