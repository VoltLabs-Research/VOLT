name: Volt Perf Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'client/package.json'
      - 'server/package.json'
      - 'docs/performance/**'
      - '.github/workflows/volt-perf-smoke.yml'
  pull_request:
    paths:
      - 'client/package.json'
      - 'server/package.json'
      - 'docs/performance/**'
      - '.github/workflows/volt-perf-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Perf smoke placeholder
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Volt client
            working-directory: client
          - name: Volt server
            working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}

      - name: Run perf smoke placeholder
        run: npm run perf:smoke
        working-directory: ${{ matrix.working-directory }}

      - name: Capture baseline placeholder
        run: npm run perf:baseline
        working-directory: ${{ matrix.working-directory }}
