name: Volt Client Vite Build

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-vite-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/volt-client-vite-build.yml'
  workflow_dispatch:

concurrency:
  group: volt-client-vite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Vite web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_SERVER_ENDPOINT: https://example.invalid
      VITE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      - name: Upload Vite dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-client-vite-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 14
