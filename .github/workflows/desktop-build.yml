name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'cluster/**'
      - 'client/**'
      - 'contracts/**'
      - 'sdk/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
          - os: windows-latest
            label: windows
            artifacts: desktop/dist/*.exe
          - os: macos-latest
            label: macos
            artifacts: desktop/dist/*.dmg
    defaults:
      run:
        working-directory: desktop
    env:
      # Build the macOS app unsigned (no Apple certs in CI).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 is what the bundled server and daemon run on: the build copies this
      # runner's node binary into the installer as the stack's runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json
            cluster/package-lock.json
            client/package-lock.json

      - name: Set up Python (node-gyp fallback for native modules without a prebuild)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        run: npm ci

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Assembles desktop/stack-runtime (client bundle, compiled server and daemon with
      # production node_modules, the SDK, and this runner's node binary), then packages
      # it under resources/stack. No Docker is involved at build or run time.
      - name: Build the local stack runtime
        run: npm run stack:build

      - name: Package installers
        run: npm run package:only

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volt-desktop-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Publishing the release fires `release: published`, which triggers
      # desktop-cli-release.yml to attach cli.cjs + compose.yml.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
