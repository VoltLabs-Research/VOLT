name: volt
services:
  volt-mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-volt}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-volt}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin | grep 1"]
      interval: 10s
      retries: 20
    volumes: [volt-mongodb-data:/data/db]

  volt-redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASS:-voltredis}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASS:-voltredis} ping | grep PONG"]
      interval: 10s
      retries: 20
    volumes: [volt-redis-data:/data]

  volt-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-voltminio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-voltminiosecret}
    command: server /data --console-address ":9001"
    ports: ["${MINIO_PORT:-9100}:9000", "${MINIO_CONSOLE:-9101}:9001"]
    volumes: [volt-minio-data:/data]

  volt-server:
    build:
      context: ${VOLT_SOURCE_DIR}/server
      dockerfile: Dockerfile.dev
    image: volt-server:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      CLIENT_HOST: ${CLIENT_HOST:-http://localhost:5273}
      SERVER_ENDPOINT: ${SERVER_ENDPOINT:-http://localhost:8100}
      REDIS_HOST: volt-redis
      REDIS_PASSWORD: ${REDIS_PASS:-voltredis}
      MINIO_ENDPOINT: volt-minio
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9100}
      MINIO_ACCESS_KEY: ${MINIO_USER:-voltminio}
      MINIO_SECRET_KEY: ${MINIO_PASS:-voltminiosecret}
      MONGO_URI: mongodb://${MONGO_USER:-volt}:${MONGO_PASS:-volt}@volt-mongodb:27017?authSource=admin
      SERVER_PORT: 8000
      SERVER_HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:-volt-local-secret}
      SSH_ENCRYPTION_KEY: ${SSH_KEY:-volt-local-ssh}
    depends_on:
      volt-mongodb: { condition: service_healthy }
      volt-redis:   { condition: service_healthy }
      volt-minio:   { condition: service_started }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLT_SOURCE_DIR}/server:/app
      - volt-server-node-modules:/app/node_modules
    ports: ["${SERVER_PORT:-8100}:8000"]

  volt-client:
    build:
      context: ${VOLT_SOURCE_DIR}/client
      args:
        VITE_SERVER_ENDPOINT: "${CLIENT_HOST:-http://localhost:5273}"
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS build
        WORKDIR /app
        ARG VITE_SERVER_ENDPOINT
        ENV VITE_SERVER_ENDPOINT=$$VITE_SERVER_ENDPOINT
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build

        FROM nginx:1.27-alpine AS runtime
        COPY --from=build /app/dist /usr/share/nginx/html
        RUN cat > /usr/share/nginx/html/__bootstrap.html <<'BOOT_EOF'
        <!doctype html>
        <html><head><meta charset="utf-8"><title>Volt</title></head>
        <body><script>
        (function(){
          try{
            var token = new URLSearchParams(location.search).get('token');
            if(token){ localStorage.setItem('authToken', token); }
          }catch(e){}
          location.replace('/');
        })();
        </script></body></html>
        BOOT_EOF
        RUN cat > /usr/share/nginx/html/__nav-bridge.js <<'BRIDGE_EOF'
        (function(){
          function send(){
            try{
              parent.postMessage({ source: 'volt-client', path: location.pathname + location.search + location.hash }, '*');
            }catch(e){}
          }
          ['pushState', 'replaceState'].forEach(function(name){
            var original = history[name];
            history[name] = function(){
              var result = original.apply(this, arguments);
              send();
              return result;
            };
          });
          window.addEventListener('popstate', send);
          window.addEventListener('message', function(event){
            var data = event.data;
            if(!data || data.source !== 'volt-shell') return;
            if(data.action === 'go' && typeof data.path === 'string'){
              var state = history.state;
              var idx = (state && typeof state.idx === 'number') ? state.idx + 1 : 1;
              var key = Math.random().toString(36).slice(2, 10);
              history.pushState({ usr: null, key: key, idx: idx }, '', data.path);
              window.dispatchEvent(new PopStateEvent('popstate', { state: history.state }));
            }else if(data.action === 'back'){
              history.back();
            }else if(data.action === 'forward'){
              history.forward();
            }
          });
          if(document.readyState !== 'loading') send();
          else window.addEventListener('DOMContentLoaded', send);
        })();
        BRIDGE_EOF
        RUN sed -i 's#</body>#<script src="/__nav-bridge.js"></script></body>#' /usr/share/nginx/html/index.html
        RUN cat > /etc/nginx/conf.d/default.conf <<'NGINX_EOF'
        resolver 127.0.0.11 valid=5s ipv6=off;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
        }

        server {
          listen 5173;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          client_max_body_size 100M;

          location / {
            try_files $$uri /index.html;
          }

          location ~ \.mjs$$ {
            default_type application/javascript;
            try_files $$uri =404;
          }

          location /api/ {
            set $$upstream_api http://volt-server:8000;
            proxy_pass $$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_read_timeout 86400s;
          }

          location /socket.io/ {
            set $$upstream_ws http://volt-server:8000;
            proxy_pass $$upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $$http_host;
            proxy_read_timeout 86400s;
          }
        }
        NGINX_EOF
        EXPOSE 5173
        CMD ["nginx", "-g", "daemon off;"]
    image: volt-client:local
    restart: unless-stopped
    depends_on: [volt-server]
    ports: ["${WEB_PORT:-5273}:5173"]

  cluster-daemon:
    profiles: [enrolled]
    build:
      context: ${CLUSTER_DAEMON_SOURCE_DIR}
      dockerfile: Dockerfile.dev
    image: cluster-daemon:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${DAEMON_PORT:-18080}
      TEAM_CLUSTER_ID: ${TEAM_CLUSTER_ID}
      TEAM_CLUSTER_HEALTHCHECK_PATH: /api/team-clusters/${TEAM_CLUSTER_ID}/healthcheck
      TEAM_CLUSTER_DAEMON_PASSWORD: ${DAEMON_PASS:-daemon-local-pass}
      VOLT_CLOUD_URL: http://volt-server:8000
      MONGODB_URI: mongodb://${MONGO_USER:-volt}:${MONGO_PASS:-volt}@volt-mongodb:27017/volt-cluster?authSource=admin
      REDIS_HOST: volt-redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      REDIS_PASSWORD: ${REDIS_PASS:-voltredis}
      MINIO_ENDPOINT: http://volt-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-voltminio}
      MINIO_SECRET_KEY: ${MINIO_PASS:-voltminiosecret}
      BUCKET_PREFIX: cluster-
      SSH_ENCRYPTION_KEY: ${SSH_KEY:-volt-local-ssh}
    depends_on:
      volt-mongodb: { condition: service_healthy }
      volt-redis:   { condition: service_healthy }
      volt-minio:   { condition: service_started }
      volt-server:  { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLUSTER_DAEMON_SOURCE_DIR}:/app
      - cluster-daemon-node-modules:/app/node_modules
    ports: ["${DAEMON_PORT:-18080}:${DAEMON_PORT:-18080}"]

volumes:
  volt-mongodb-data:
  volt-redis-data:
  volt-minio-data:
  cluster-mongodb-data:
  cluster-redis-data:
  cluster-minio-data:
  volt-server-node-modules:
  cluster-daemon-node-modules:
