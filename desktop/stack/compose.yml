name: volt
services:

  volt-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volt}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-volt}
      POSTGRES_DB: ${POSTGRES_DB:-volt}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 20
    volumes: [volt-postgres-data:/var/lib/postgresql/data]


  volt-server:
    build:
      context: ${VOLT_SOURCE_DIR}/server
      dockerfile: Dockerfile.dev
    image: volt-server:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      CLIENT_HOST: ${CLIENT_HOST:-http://localhost:5273}
      SERVER_ENDPOINT: ${SERVER_ENDPOINT:-http://localhost:8100}
      DATABASE_URL: postgres://${POSTGRES_USER:-volt}:${POSTGRES_PASS:-volt}@volt-postgres:5432/${POSTGRES_DB:-volt}
      SERVER_DATA_DIR: /var/lib/volt-server
      SERVER_PORT: 8000
      SERVER_HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:-volt-local-secret}
      SSH_ENCRYPTION_KEY: ${SSH_KEY:-volt-local-ssh}
    depends_on:
      volt-postgres: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Avatars and chat attachments live here now, so this is data, not a cache.
      - volt-server-data:/var/lib/volt-server
      - ${VOLT_SOURCE_DIR}/server:/app
      - ${VOLT_SOURCE_DIR}/contracts:/contracts:ro
      # The install-manifest build distribution mode ships the daemon source (and
      # the SDK it links) to enrolled hosts; both live in this repository now. The
      # server also compiles the SDK contracts from source through its tsconfig
      # paths map, which resolves to /sdk inside this container.
      - ${VOLT_SOURCE_DIR}/cluster:/ClusterDaemon:ro
      - ${VOLT_SOURCE_DIR}/sdk:/sdk:ro
      - volt-server-node-modules:/app/node_modules
    ports: ["${SERVER_PORT:-8100}:8000"]

  volt-client:
    build:
      context: ${VOLT_SOURCE_DIR}
      dockerfile: client/Dockerfile.stack
    image: volt-client:local
    restart: unless-stopped
    depends_on: [volt-server]
    ports: ["${WEB_PORT:-5273}:5173"]

  cluster-daemon:
    profiles: [enrolled]
    build:
      # The daemon links @voltstack/daemon-cluster-client from the repository, so
      # the build context is the repo root and the SDK travels with it.
      context: ${VOLT_SOURCE_DIR}
      dockerfile: cluster/Dockerfile.dev
    image: cluster-daemon:local
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    environment:
      NODE_ENV: production
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-volt}
      HOST: 0.0.0.0
      PORT: ${DAEMON_PORT:-18080}
      TEAM_CLUSTER_ID: ${TEAM_CLUSTER_ID}
      TEAM_CLUSTER_DAEMON_PASSWORD: ${DAEMON_PASS:-daemon-local-pass}
      VOLT_CLOUD_URL: http://volt-server:8000
      DATABASE_URL: postgres://${POSTGRES_USER:-volt}:${POSTGRES_PASS:-volt}@volt-postgres:5432/volt-cluster
      DAEMON_DATA_DIR: /var/lib/volt-daemon
      BUCKET_PREFIX: cluster-
      # Both services share this network, so object bytes have no reason to be
      # reframed onto the daemon's socket.io control connection to reach the server.
      OBJECT_GATEWAY_PUBLIC_BASE_URL: http://cluster-daemon:${DAEMON_PORT:-18080}
    depends_on:
      volt-postgres: { condition: service_healthy }
      volt-server:   { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLT_SOURCE_DIR}/cluster:/app/cluster
      - cluster-daemon-node-modules:/app/cluster/node_modules
      # The object store lives here now, so this holds the cluster's data — not a cache.
      - cluster-daemon-data:/var/lib/volt-daemon
    ports: ["${DAEMON_PORT:-18080}:${DAEMON_PORT:-18080}"]

volumes:
  volt-postgres-data:
  volt-server-data:
  cluster-daemon-data:
  volt-server-node-modules:
  cluster-daemon-node-modules:
