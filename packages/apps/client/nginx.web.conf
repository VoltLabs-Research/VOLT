# Static app.voltcloud.dev: the landing at / and the client's routes everywhere else.
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 100M;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /landing/index.html =404;
  }

  location /landing/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  # The entrypoints must always revalidate, so a new image never serves a stale
  # index.html pointing at hashed assets that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /volt-service-worker.js {
    add_header Cache-Control "no-cache";
  }

  location ~ \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }
}
