get:
  operationId: getParticleFilterUniqueValuesByAnalysis
  tags:
  - ParticleFilter
  summary: Get unique values for a property within an analysis
  description: Returns the distinct values for a specified property within the context of a specific analysis.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: trajectoryId
    in: path
    required: true
    description: Unique identifier of the trajectory
    schema:
      type: string
  - name: analysisId
    in: path
    required: true
    description: Unique identifier of the analysis
    schema:
      type: string
  - name: property
    in: query
    required: true
    description: Property name to retrieve unique values for
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    oneOf:
                    - type: string
                    - type: number
                  description: List of unique values for the property
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
