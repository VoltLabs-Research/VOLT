get:
  operationId: getParticleFilterPropertiesByAnalysis
  tags:
  - ParticleFilter
  summary: Get filter properties for an analysis
  description: Returns the list of properties available for particle filtering within the context of a specific analysis.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: trajectoryId
    in: path
    required: true
    description: Unique identifier of the trajectory
    schema:
      type: string
  - name: analysisId
    in: path
    required: true
    description: Unique identifier of the analysis
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/particle-filters.yaml#/ParticleFilterProperty
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
