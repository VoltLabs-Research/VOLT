get:
  operationId: getParticleFilterByAnalysis
  tags:
  - ParticleFilter
  summary: Get filter model for an analysis
  description: Returns the current particle filter configuration for a trajectory within the context of a specific analysis.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: trajectoryId
    in: path
    required: true
    description: Unique identifier of the trajectory
    schema:
      type: string
  - name: analysisId
    in: path
    required: true
    description: Unique identifier of the analysis
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/particle-filters.yaml#/ParticleFilterModel
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: applyParticleFilterByAnalysis
  tags:
  - ParticleFilter
  summary: Apply particle filter for an analysis
  description: Applies a particle filter to a trajectory within the context of a specific analysis.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: trajectoryId
    in: path
    required: true
    description: Unique identifier of the trajectory
    schema:
      type: string
  - name: analysisId
    in: path
    required: true
    description: Unique identifier of the analysis
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - filters
          properties:
            filters:
              type: array
              items:
                type: object
                required:
                - property
                - operator
                - value
                properties:
                  property:
                    type: string
                    description: Property name to filter on
                  operator:
                    type: string
                    description: Comparison operator (e.g., eq, neq, gt, lt, gte, lte, in)
                  value:
                    oneOf:
                    - type: string
                    - type: number
                    - type: array
                      items:
                        oneOf:
                        - type: string
                        - type: number
                    description: Value or values to compare against
  responses:
    '201':
      description: Particle filter applied successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/particle-filters.yaml#/ParticleFilterModel
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
