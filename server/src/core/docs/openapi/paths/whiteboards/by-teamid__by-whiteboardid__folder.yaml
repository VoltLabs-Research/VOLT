patch:
  operationId: moveWhiteboard
  tags:
  - Whiteboards
  summary: Move whiteboard to folder
  description: Moves the specified whiteboard into a different folder.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - folderId
          properties:
            folderId:
              type:
              - string
              - 'null'
              description: Target folder ID, or null to move to root.
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/whiteboards.yaml#/Whiteboard
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
