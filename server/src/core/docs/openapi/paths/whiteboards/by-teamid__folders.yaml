get:
  operationId: listWhiteboardFolders
  tags:
  - Whiteboards
  summary: List whiteboard folders
  description: Returns a paginated list of whiteboard folders for the specified team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
  - name: parentId
    in: query
    required: false
    description: Filter folders by parent folder ID.
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/PaginatedResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: createWhiteboardFolder
  tags:
  - Whiteboards
  summary: Create whiteboard folder
  description: Creates a new folder for organizing whiteboards.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - title
          properties:
            title:
              type: string
            parentId:
              type:
              - string
              - 'null'
  responses:
    '201':
      description: Successfully created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
