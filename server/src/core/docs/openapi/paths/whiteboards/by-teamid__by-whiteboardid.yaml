get:
  operationId: getWhiteboard
  tags:
  - Whiteboards
  summary: Get whiteboard
  description: Returns a single whiteboard by its unique identifier.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/whiteboards.yaml#/Whiteboard
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  operationId: updateWhiteboard
  tags:
  - Whiteboards
  summary: Update whiteboard
  description: Updates the specified whiteboard with the provided fields.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/whiteboards.yaml#/Whiteboard
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteWhiteboard
  tags:
  - Whiteboards
  summary: Delete whiteboard
  description: Permanently deletes the specified whiteboard and its state.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
