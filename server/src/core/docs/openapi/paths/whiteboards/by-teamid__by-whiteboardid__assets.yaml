post:
  operationId: uploadWhiteboardAsset
  tags:
  - Whiteboards
  summary: Upload whiteboard asset
  description: Uploads an asset file to the specified whiteboard.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
          - file
          properties:
            file:
              type: string
              format: binary
              description: The asset file to upload.
  responses:
    '201':
      description: Successfully uploaded
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    _id:
                      type: string
                    url:
                      type: string
                      format: uri
                    name:
                      type: string
                    size:
                      type: integer
                    mimeType:
                      type: string
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
