post:
  operationId: uploadWhiteboardAsset
  tags:
  - Whiteboards
  summary: Upload whiteboard asset
  description: Creates a signed upload target for a whiteboard asset. The client uploads the file directly through the cluster object gateway using the returned URL.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - fileName
          - size
          properties:
            fileName:
              type: string
            size:
              type: integer
              format: int64
              minimum: 1
            type:
              type: string
          additionalProperties: false
  responses:
    '201':
      description: Signed upload target created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  required:
                  - assetId
                  - uploadUrl
                  - expiresAt
                  properties:
                    assetId:
                      type: string
                    uploadUrl:
                      type: string
                    expiresAt:
                      type: string
                      format: date-time
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
