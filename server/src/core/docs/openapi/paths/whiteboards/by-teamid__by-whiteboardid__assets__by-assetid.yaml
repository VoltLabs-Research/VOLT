get:
  operationId: getWhiteboardAsset
  tags:
  - Whiteboards
  summary: Get whiteboard asset
  description: Returns the specified asset belonging to the whiteboard.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  - name: assetId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    _id:
                      type: string
                    url:
                      type: string
                      format: uri
                    name:
                      type: string
                    size:
                      type: integer
                    mimeType:
                      type: string
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
