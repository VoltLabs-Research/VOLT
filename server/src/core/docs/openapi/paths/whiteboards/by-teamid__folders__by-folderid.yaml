get:
  operationId: getWhiteboardFolder
  tags:
  - Whiteboards
  summary: Get whiteboard folder
  description: Returns a single whiteboard folder by its unique identifier.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: folderId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  operationId: updateWhiteboardFolder
  tags:
  - Whiteboards
  summary: Update whiteboard folder
  description: Updates the title of the specified whiteboard folder.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: folderId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - title
          properties:
            title:
              type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteWhiteboardFolder
  tags:
  - Whiteboards
  summary: Delete whiteboard folder
  description: Permanently deletes the specified whiteboard folder and recursively deletes all nested folders and whiteboards it contains.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: folderId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
