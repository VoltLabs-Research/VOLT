get:
  operationId: getWhiteboardState
  tags:
  - Whiteboards
  summary: Get whiteboard state
  description: Returns the current drawing state of the whiteboard. Response may be up to 10MB.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/whiteboards.yaml#/WhiteboardState
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  operationId: saveWhiteboardState
  tags:
  - Whiteboards
  summary: Save whiteboard state
  description: Saves the drawing state of the whiteboard. Request body may be up to 10MB.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: whiteboardId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/whiteboards.yaml#/WhiteboardState
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
