get:
  operationId: listTeamClusters
  tags:
  - Team Clusters
  summary: List team clusters
  description: Returns paginated clusters available to the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/Limit
  - $ref: ../../components/parameters/common.yaml#/Search
  responses:
    '200':
      description: Team clusters
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/common.yaml#/TeamCluster
                pagination:
                  $ref: ../../components/schemas/common.yaml#/Pagination
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  operationId: createTeamCluster
  tags:
  - Team Clusters
  summary: Create team cluster
  description: Registers a new team cluster.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams.yaml#/CreateTeamClusterRequest
  responses:
    '201':
      description: Cluster created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/common.yaml#/TeamCluster
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
