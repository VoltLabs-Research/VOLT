get:
  operationId: listSecretKeys
  tags:
  - Secret Keys
  summary: List secret keys
  description: Returns paginated secret keys for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/Limit
  responses:
    '200':
      description: Secret keys
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/teams.yaml#/SecretKeyListItem
                pagination:
                  $ref: ../../components/schemas/common.yaml#/Pagination
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  operationId: createSecretKey
  tags:
  - Secret Keys
  summary: Create secret key
  description: Creates a new secret API key for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams.yaml#/CreateSecretKeyRequest
  responses:
    '201':
      description: Secret key created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/CreatedSecretKey
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
