get:
  operationId: listTeamAIIntegrationModels
  tags:
  - AI Integrations
  summary: List team AI models
  description: Returns AI models available to the team across providers.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '200':
      description: AI models
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/TeamAIIntegrationModelsResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
