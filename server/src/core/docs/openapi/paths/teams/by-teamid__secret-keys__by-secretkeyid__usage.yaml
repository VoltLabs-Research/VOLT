get:
  operationId: getSecretKeyUsage
  tags:
  - Secret Keys
  summary: Get secret key usage
  description: Returns usage analytics for one secret key.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/SecretKeyId
  - name: days
    in: query
    required: false
    description: Usage window in days.
    schema:
      type: integer
      minimum: 1
      maximum: 365
  responses:
    '200':
      description: Secret key usage
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/SecretKeyUsage
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
