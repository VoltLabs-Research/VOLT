post:
  operationId: generateInviteCode
  tags:
  - Teams
  summary: Generate invite code
  description: Generates a 5-character alphanumeric code to join the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '201':
      description: Code generated
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    code:
                      type: string
                      pattern: ^[A-Z0-9]{5}$
                      example: AB1C2
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
delete:
  operationId: deleteInviteCode
  tags:
  - Teams
  summary: Delete invite code
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '200':
      description: Code deleted
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
