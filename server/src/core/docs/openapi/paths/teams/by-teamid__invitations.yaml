get:
  operationId: listPendingTeamInvitations
  tags:
  - Team Invitations
  summary: List team invitations
  description: Returns pending invitations for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/Limit
  responses:
    '200':
      description: Invitations
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/teams.yaml#/TeamInvitation
                pagination:
                  $ref: ../../components/schemas/common.yaml#/Pagination
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  operationId: sendTeamInvitation
  tags:
  - Team Invitations
  summary: Send team invitation
  description: Creates and sends an invitation to join the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams.yaml#/SendTeamInvitationRequest
  responses:
    '201':
      description: Invitation sent
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/TeamInvitation
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
