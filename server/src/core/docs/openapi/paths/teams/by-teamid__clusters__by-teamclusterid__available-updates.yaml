get:
  operationId: fetchAvailableClusterVersions
  tags:
  - Team Clusters
  summary: List available cluster updates
  description: Returns available runtime versions for the cluster.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TeamClusterId
  responses:
    '200':
      description: Available versions
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    versions:
                      type: array
                      items:
                        $ref: ../../components/schemas/teams.yaml#/AvailableClusterVersion
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
