patch:
  operationId: revokeSecretKeyById
  tags:
  - Secret Keys
  summary: Revoke secret key
  description: Revokes a secret key so it can no longer authenticate requests.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/SecretKeyId
  responses:
    '200':
      description: Secret key revoked
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/SecretKeyListItem
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteSecretKeyById
  tags:
  - Secret Keys
  summary: Delete secret key
  description: Permanently deletes a secret key.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/SecretKeyId
  responses:
    '200':
      description: Secret key deleted
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
