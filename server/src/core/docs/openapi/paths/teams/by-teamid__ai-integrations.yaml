get:
  operationId: listTeamAIIntegrations
  tags:
  - AI Integrations
  summary: List team AI integrations
  description: Returns configured AI provider integrations and the available provider catalog for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '200':
      description: AI integrations
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/TeamAIIntegrationsResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
