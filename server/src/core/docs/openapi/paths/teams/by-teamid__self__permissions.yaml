get:
  operationId: getMyTeamPermissions
  tags:
  - Teams - Self
  summary: Get my team permissions
  description: Returns the authenticated user's RBAC permissions within the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '200':
      description: Permission list
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    permissions:
                      type: array
                      items:
                        type: string
                      example:
                      - trajectory:read
                      - trajectory:create
                      - container:read
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
