post:
  operationId: regenerateTeamClusterEnrollmentToken
  tags:
  - Team Clusters
  summary: Regenerate enrollment token
  description: Regenerates the enrollment token used by a cluster daemon.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TeamClusterId
  responses:
    '200':
      description: Enrollment token
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    enrollmentToken:
                      type: string
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
