get:
  operationId: getSecretKeyTeamMetrics
  tags:
  - Secret Keys
  summary: Get secret key metrics
  description: Returns usage analytics for all secret keys in the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: days
    in: query
    required: false
    description: Usage window in days.
    schema:
      type: integer
      minimum: 1
      maximum: 365
  responses:
    '200':
      description: Secret key metrics
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/SecretKeyTeamMetrics
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
