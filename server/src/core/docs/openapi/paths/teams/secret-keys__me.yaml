get:
  operationId: getCurrentSecretKey
  tags:
  - Secret Keys
  summary: Get current secret key
  description: Returns the current authenticated secret key when the request is authenticated with a team secret key.
  responses:
    '200':
      description: Current secret key
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/CurrentSecretKey
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
