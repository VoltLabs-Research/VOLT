post:
  operationId: createTeamAIIntegration
  tags:
  - AI Integrations
  summary: Create AI integration
  description: Creates a provider integration for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: provider
    in: path
    required: true
    description: AI provider identifier.
    schema:
      $ref: ../../components/schemas/common.yaml#/AIProvider
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams.yaml#/TeamAIIntegrationMutationRequest
  responses:
    '201':
      description: Integration created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/TeamAIIntegration
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
patch:
  operationId: updateTeamAIIntegration
  tags:
  - AI Integrations
  summary: Update AI integration
  description: Updates a provider integration for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: provider
    in: path
    required: true
    description: AI provider identifier.
    schema:
      $ref: ../../components/schemas/common.yaml#/AIProvider
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/teams.yaml#/TeamAIIntegrationMutationRequest
  responses:
    '200':
      description: Integration updated
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/teams.yaml#/TeamAIIntegration
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteTeamAIIntegration
  tags:
  - AI Integrations
  summary: Delete AI integration
  description: Deletes a provider integration for the team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: provider
    in: path
    required: true
    description: AI provider identifier.
    schema:
      $ref: ../../components/schemas/common.yaml#/AIProvider
  responses:
    '200':
      description: Integration deleted
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
