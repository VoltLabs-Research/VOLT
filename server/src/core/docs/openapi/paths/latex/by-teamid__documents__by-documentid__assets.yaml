get:
  operationId: listLatexAssets
  tags:
  - LaTeX
  summary: List LaTeX document assets
  description: Returns all assets associated with the specified LaTeX document.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/latex.yaml#/LatexAsset
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: uploadLatexAsset
  tags:
  - LaTeX
  summary: Upload LaTeX document assets
  description: Creates signed upload targets for up to 20 LaTeX assets. The client uploads each file directly through the cluster object gateway using the returned URLs.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - files
          properties:
            path:
              type: string
              description: Optional relative path prefix applied to uploaded files.
            files:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
                required:
                - name
                - size
                properties:
                  name:
                    type: string
                  size:
                    type: integer
                    format: int64
                    minimum: 1
                  type:
                    type: string
                additionalProperties: false
              description: Asset file metadata. File bytes are uploaded directly to each returned upload URL.
          additionalProperties: false
  responses:
    '201':
      description: Signed upload targets created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  required:
                  - uploaded
                  - failedCount
                  - total
                  properties:
                    uploaded:
                      type: array
                      items:
                        allOf:
                        - $ref: ../../components/schemas/latex.yaml#/LatexAsset
                        - type: object
                          required:
                          - uploadIndex
                          - uploadUrl
                          - expiresAt
                          properties:
                            uploadIndex:
                              type: integer
                              minimum: 0
                            uploadUrl:
                              type: string
                            expiresAt:
                              type: string
                              format: date-time
                    failedCount:
                      type: integer
                      minimum: 0
                    total:
                      type: integer
                      minimum: 0
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
