get:
  operationId: listLatexAssets
  tags:
  - LaTeX
  summary: List LaTeX document assets
  description: Returns all assets associated with the specified LaTeX document.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/latex.yaml#/LatexAsset
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: uploadLatexAsset
  tags:
  - LaTeX
  summary: Upload LaTeX document assets
  description: Uploads up to 20 asset files to the specified LaTeX document.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
          - files
          properties:
            files:
              type: array
              items:
                type: string
                format: binary
              maxItems: 20
              description: Asset files to upload (maximum 20).
  responses:
    '201':
      description: Successfully uploaded
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/latex.yaml#/LatexAsset
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
