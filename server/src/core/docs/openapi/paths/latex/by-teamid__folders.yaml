get:
  operationId: listLatexFolders
  tags:
  - LaTeX
  summary: List LaTeX folders
  description: Returns all LaTeX folders for the specified team.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: createLatexFolder
  tags:
  - LaTeX
  summary: Create LaTeX folder
  description: Creates a new folder for organizing LaTeX documents.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - name
          properties:
            name:
              type: string
            parentId:
              type:
              - string
              - 'null'
  responses:
    '201':
      description: Successfully created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/common.yaml#/Folder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
