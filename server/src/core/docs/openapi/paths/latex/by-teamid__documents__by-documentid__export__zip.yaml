get:
  operationId: exportLatexDocumentZip
  tags:
  - LaTeX
  summary: Export LaTeX document as .zip
  description: Exports the LaTeX document and all associated assets as a downloadable .zip archive.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: The .zip archive
      content:
        application/zip:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
