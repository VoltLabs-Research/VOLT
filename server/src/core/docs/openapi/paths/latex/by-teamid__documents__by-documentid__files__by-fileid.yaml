patch:
  operationId: updateLatexFile
  tags:
  - LaTeX
  summary: Update LaTeX file
  description: Updates the specified file within a LaTeX document.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  - name: fileId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            content:
              type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/latex.yaml#/LatexFile
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteLatexFile
  tags:
  - LaTeX
  summary: Delete LaTeX file
  description: Permanently deletes the specified file from the LaTeX document.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  - name: fileId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
