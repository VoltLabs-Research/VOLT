get:
  operationId: getLatexDocument
  tags:
  - LaTeX
  summary: Get LaTeX document
  description: Returns a single LaTeX document by its unique identifier.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/latex.yaml#/LatexDocument
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteLatexDocument
  tags:
  - LaTeX
  summary: Delete LaTeX document
  description: Permanently deletes the specified LaTeX document and all associated files and assets.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  operationId: updateLatexDocument
  tags:
  - LaTeX
  summary: Update LaTeX document
  description: Updates the specified LaTeX document with the provided fields.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: documentId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/latex.yaml#/LatexDocument
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
