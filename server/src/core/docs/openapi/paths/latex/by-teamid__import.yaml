post:
  operationId: importLatexDocument
  tags:
  - LaTeX
  summary: Import LaTeX document
  description: Imports a LaTeX document from an uploaded file.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
          - file
          properties:
            file:
              type: string
              format: binary
              description: The LaTeX file to import.
  responses:
    '201':
      description: Successfully imported
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/latex.yaml#/LatexDocument
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
