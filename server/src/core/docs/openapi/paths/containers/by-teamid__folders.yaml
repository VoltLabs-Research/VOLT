get:
  tags:
  - Containers
  summary: List folders
  description: Retrieve a paginated list of container folders for a team.
  operationId: listContainerFolders
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    required: false
    description: Number of items per page (max 500)
    schema:
      type: integer
      minimum: 1
      maximum: 500
  - name: parentId
    in: query
    required: false
    description: Filter folders by parent folder ID
    schema:
      type: string
  responses:
    '200':
      description: List of folders retrieved successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/PaginatedResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/containers.yaml#/ContainerFolder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  tags:
  - Containers
  summary: Create a folder
  description: Create a new container folder within a team.
  operationId: createContainerFolder
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/containers.yaml#/CreateFolderRequest
  responses:
    '201':
      description: Folder created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/containers.yaml#/ContainerFolder
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
