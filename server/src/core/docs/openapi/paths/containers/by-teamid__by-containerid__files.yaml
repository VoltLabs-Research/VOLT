get:
  tags:
  - Containers
  summary: List container files
  description: List files in a container directory. If no path is provided, lists the root directory.
  operationId: getContainerFiles
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  - name: path
    in: query
    required: false
    description: Directory path to list files from
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Container files retrieved successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/containers.yaml#/ContainerFile
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
