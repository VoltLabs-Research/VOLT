post:
  tags:
  - Containers
  summary: Create a container
  description: Create a new container within a team.
  operationId: createContainer
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/containers.yaml#/CreateContainerRequest
  responses:
    '201':
      description: Container created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/containers.yaml#/Container
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
get:
  tags:
  - Containers
  summary: List containers by team
  description: Retrieve a paginated list of containers for a team.
  operationId: listContainersByTeamId
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
  - name: limit
    in: query
    required: false
    description: Number of items per page (max 100)
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: search
    in: query
    required: false
    description: Search term to filter containers
    schema:
      type: string
      minLength: 1
  - name: folderId
    in: query
    required: false
    description: Filter containers by folder ID
    schema:
      type: string
  responses:
    '200':
      description: List of containers retrieved successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/containers.yaml#/Container
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
