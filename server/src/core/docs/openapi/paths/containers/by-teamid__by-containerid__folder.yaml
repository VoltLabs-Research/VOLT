patch:
  tags:
  - Containers
  summary: Move a container to a folder
  description: Move a container into a different folder, or remove it from its current folder by setting folderId to null.
  operationId: moveContainer
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/containers.yaml#/MoveContainerRequest
  responses:
    '200':
      description: Container moved successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/containers.yaml#/Container
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
