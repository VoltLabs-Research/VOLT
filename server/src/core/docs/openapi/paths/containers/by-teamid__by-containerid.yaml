get:
  tags:
  - Containers
  summary: Get a container
  description: Retrieve a specific container by its ID.
  operationId: getContainerById
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Container retrieved successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/containers.yaml#/Container
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  tags:
  - Containers
  summary: Update a container
  description: Update a container by performing an action (start, stop, restart) or modifying its environment variables and ports.
  operationId: updateContainerById
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/containers.yaml#/UpdateContainerRequest
  responses:
    '200':
      description: Container updated successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/containers.yaml#/Container
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  tags:
  - Containers
  summary: Delete a container
  description: Delete a specific container by its ID.
  operationId: deleteContainerById
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Container deleted successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
