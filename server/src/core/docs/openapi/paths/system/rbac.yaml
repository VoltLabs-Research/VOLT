get:
  operationId: getRbacConfig
  tags:
  - System
  summary: Get RBAC configuration
  description: Returns the role-based access control permissions configuration for the platform.
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/system.yaml#/RbacConfig
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
