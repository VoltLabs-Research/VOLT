get:
  tags:
  - Plugin Listings
  summary: Get export options for an analysis listing download
  description: Returns the available config, listings, and sublistings that can be selected before exporting analysis results.
  operationId: getAnalysisListingExportOptions
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/AnalysisId
  responses:
    '200':
      description: Available export options for the analysis
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    analysisId:
                      type: string
                    hasConfig:
                      type: boolean
                    listings:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          listingId:
                            type: string
                          listingName:
                            type: string
                          label:
                            type: string
                    subListings:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          exposureId:
                            type: string
                          exposureName:
                            type: string
                          timestep:
                            type: integer
                          subListingName:
                            type: string
                          label:
                            type: string
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
