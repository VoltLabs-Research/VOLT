get:
  tags:
  - Plugin Listings
  summary: Get plugin listing documents
  description: Returns paginated listing documents for a specific plugin with optional filters.
  operationId: getPluginListingDocuments
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/PluginId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/ListingLimit
  - name: analysisId
    in: query
    required: false
    description: Filter by analysis identifier
    schema:
      $ref: ../../components/schemas/common.yaml#/ObjectId
  - name: exposureId
    in: query
    required: false
    description: Filter by domain exposure identifier
    schema:
      type: string
      minLength: 1
  - name: exposureName
    in: query
    required: false
    description: Filter by exposure name
    schema:
      type: string
  - name: sortAsc
    in: query
    required: false
    description: Sort results in ascending order
    schema:
      type: boolean
  - name: trajectoryId
    in: query
    required: false
    description: Filter by trajectory identifier
    schema:
      $ref: ../../components/schemas/common.yaml#/ObjectId
  responses:
    '200':
      description: Paginated plugin listing documents
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/plugins.yaml#/PaginatedListingRows
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
