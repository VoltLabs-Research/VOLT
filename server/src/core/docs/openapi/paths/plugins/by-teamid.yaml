get:
  tags:
  - Plugins
  summary: List plugins
  description: Returns all plugins for the specified team.
  operationId: listPlugins
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  responses:
    '200':
      description: List of plugins
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/plugins.yaml#/Plugin
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  tags:
  - Plugins
  summary: Create a plugin
  description: Creates a new plugin with the provided workflow definition.
  operationId: createPlugin
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/plugins.yaml#/CreatePluginRequest
  responses:
    '201':
      description: Plugin created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/plugins.yaml#/Plugin
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
