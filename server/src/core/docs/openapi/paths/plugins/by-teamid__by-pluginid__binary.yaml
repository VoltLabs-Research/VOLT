patch:
  tags:
  - Plugins
  summary: Create plugin binary upload target
  description: Creates a signed upload target for a plugin binary. The client uploads the file directly through the cluster object gateway, then commits the upload.
  operationId: createPluginBinaryUploadTarget
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/PluginId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/plugins.yaml#/CreatePluginBinaryUploadRequest
  responses:
    '200':
      description: Signed upload target created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/plugins.yaml#/PluginBinaryUploadTarget
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  tags:
  - Plugins
  summary: Delete a plugin binary
  description: Removes the binary attachment from a plugin.
  operationId: deletePluginBinary
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/PluginId
  responses:
    '204':
      description: Binary deleted successfully
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
