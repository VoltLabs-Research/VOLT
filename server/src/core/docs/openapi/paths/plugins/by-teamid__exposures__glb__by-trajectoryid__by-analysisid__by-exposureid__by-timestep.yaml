get:
  tags:
  - Plugin Exposures
  summary: Get plugin exposure GLB
  description: Returns a GLB (3D model) binary for a specific plugin exposure at a given trajectory, analysis, exposure, and timestep.
  operationId: getPluginExposureGLB
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TrajectoryId
  - $ref: ../../components/parameters/common.yaml#/AnalysisId
  - name: exposureId
    in: path
    required: true
    description: Exposure identifier
    schema:
      type: string
      minLength: 1
  - name: timestep
    in: path
    required: true
    description: Timestep index
    schema:
      type: integer
      minimum: 0
  responses:
    '200':
      description: GLB binary file
      content:
        model/gltf-binary:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
