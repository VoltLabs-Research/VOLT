get:
  tags:
  - Plugin Exposures
  summary: Export plugin exposures by analysis
  description: Exports all plugin exposure data for a given analysis.
  operationId: getPluginExposureExport
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/AnalysisId
  responses:
    '200':
      description: Exported exposure data file
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
