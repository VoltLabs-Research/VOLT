get:
  tags:
  - Plugin Listings
  summary: Get listing rows by analysis ID
  description: Returns paginated listing rows for a given analysis.
  operationId: getListingRowsByAnalysisId
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/AnalysisId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/ListingLimit
  - name: sortAsc
    in: query
    required: false
    description: Sort results in ascending order
    schema:
      type: boolean
  responses:
    '200':
      description: Paginated listing rows
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/plugins.yaml#/PaginatedListingRows
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
