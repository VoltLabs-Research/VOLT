post:
  tags:
  - Chat
  summary: Get or create a direct chat
  description: Retrieve an existing direct chat with a user or create a new one if it does not exist.
  operationId: getOrCreateChat
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: targetUserId
    in: path
    required: true
    description: The ID of the target user to chat with
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Direct chat retrieved or created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/chats.yaml#/Chat
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
