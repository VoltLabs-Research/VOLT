post:
  tags:
  - Chat
  summary: Create a group chat
  description: Create a new group chat with specified participants.
  operationId: createGroupChat
  security:
  - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/chats.yaml#/CreateGroupChatRequest
  responses:
    '201':
      description: Group chat created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/chats.yaml#/Chat
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
