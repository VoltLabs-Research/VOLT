post:
  tags:
  - Chat
  summary: Add users to a group chat
  description: Add one or more users to an existing group chat.
  operationId: addUsersToGroupChat
  security:
  - BearerAuth: []
  parameters:
  - name: chatId
    in: path
    required: true
    description: The ID of the group chat
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/chats.yaml#/AddUsersRequest
  responses:
    '200':
      description: Users added to the group chat successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/chats.yaml#/Chat
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  tags:
  - Chat
  summary: Remove users from a group chat
  description: Remove one or more users from an existing group chat.
  operationId: removeUsersFromGroupChat
  security:
  - BearerAuth: []
  parameters:
  - name: chatId
    in: path
    required: true
    description: The ID of the group chat
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/chats.yaml#/RemoveUsersRequest
  responses:
    '200':
      description: Users removed from the group chat successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/chats.yaml#/Chat
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
