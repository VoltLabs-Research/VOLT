patch:
  tags:
  - Chat Messages
  summary: Edit a chat message
  description: Edit the content of an existing chat message.
  operationId: editChatMessage
  security:
  - BearerAuth: []
  parameters:
  - name: chatId
    in: path
    required: true
    description: The ID of the chat
    schema:
      type: string
      minLength: 1
  - name: messageId
    in: path
    required: true
    description: The ID of the message to edit
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/chat-messages.yaml#/EditMessageRequest
  responses:
    '200':
      description: Message edited successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/chat-messages.yaml#/ChatMessage
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  tags:
  - Chat Messages
  summary: Delete a chat message
  description: Delete an existing chat message.
  operationId: deleteChatMessage
  security:
  - BearerAuth: []
  parameters:
  - name: chatId
    in: path
    required: true
    description: The ID of the chat
    schema:
      type: string
      minLength: 1
  - name: messageId
    in: path
    required: true
    description: The ID of the message to delete
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Message deleted successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
