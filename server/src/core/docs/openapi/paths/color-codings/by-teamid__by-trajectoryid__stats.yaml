get:
  operationId: getColorCodingStats
  tags:
  - ColorCoding
  summary: Get color coding statistics
  description: Returns statistical information for the current color coding applied to the trajectory.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: trajectoryId
    in: path
    required: true
    description: Unique identifier of the trajectory
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/color-codings.yaml#/ColorCodingStats
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
