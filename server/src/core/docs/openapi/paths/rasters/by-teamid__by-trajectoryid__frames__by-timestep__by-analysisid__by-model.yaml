get:
  tags:
  - Raster
  summary: Get a raster frame PNG for a specific analysis model
  description: Returns a PNG image for the specified trajectory frame at the given timestep, filtered by analysis and model.
  operationId: getRasterFramePNGByAnalysisModel
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TrajectoryId
  - name: timestep
    in: path
    required: true
    description: Timestep index (zero-based integer)
    schema:
      type: integer
      minimum: 0
  - name: analysisId
    in: path
    required: true
    description: Analysis identifier
    schema:
      type: string
      minLength: 1
  - name: model
    in: path
    required: true
    description: Model identifier
    schema:
      type: string
      minLength: 1
  responses:
    '200':
      description: Raster frame PNG image
      content:
        image/png:
          schema:
            type: string
            format: binary
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
