post:
  tags:
  - Raster
  summary: Trigger rasterization
  description: Triggers a rasterization job for the specified trajectory.
  operationId: triggerRasterization
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TrajectoryId
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/rasters.yaml#/TriggerRasterizationRequest
  responses:
    '201':
      description: Rasterization job triggered
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/rasters.yaml#/RasterJob
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
