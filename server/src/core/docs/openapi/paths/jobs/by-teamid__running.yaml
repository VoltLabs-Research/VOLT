delete:
  operationId: removeRunningJobs
  tags:
  - Jobs
  summary: Remove queued and running jobs for a trajectory
  description: Kills the running processes and removes queued and in-flight jobs for the specified trajectory, dropping them from BullMQ and the Redis projection.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: trajectoryId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
