post:
  operationId: retryFailedJobs
  tags:
  - Jobs
  summary: Retry failed jobs for a trajectory
  description: Re-queues every failed job for the specified trajectory, preserving the original payload.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: trajectoryId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    retriedFrames:
                      type: integer
                      description: Number of jobs queued for retry.
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
