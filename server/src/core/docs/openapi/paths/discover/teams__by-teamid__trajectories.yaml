get:
  operationId: listPublicTeamTrajectories
  tags:
  - Trajectories
  summary: Discover public team trajectories
  description: Returns public trajectories for a team without requiring authentication or team membership.
  security: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: page
    in: query
    description: Page number for pagination.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: limit
    in: query
    description: Number of items per page.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: search
    in: query
    description: Search term to filter public trajectories by name.
    schema:
      type: string
  responses:
    '200':
      description: Public trajectories returned successfully.
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/PaginatedResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        $ref: ../../components/schemas/common.yaml#/ObjectId
                      name:
                        type: string
                      team:
                        $ref: ../../components/schemas/common.yaml#/ObjectId
                      status:
                        type: string
                      isPublic:
                        type: boolean
                      hasPreview:
                        type: boolean
                      atoms:
                        type: integer
                      framesCount:
                        type: integer
                      firstTimestep:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                _meta:
                  type: object
                  properties:
                    team:
                      type: object
                      required:
                      - _id
                      - name
                      properties:
                        _id:
                          $ref: ../../components/schemas/common.yaml#/ObjectId
                        name:
                          type: string
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
