post:
  operationId: signIn
  tags:
  - Auth
  summary: Sign in
  description: Authenticates a user with email and password. Returns a JWT.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth.yaml#/SignInRequest
        example:
          email: user@example.com
          password: myPassword123
  responses:
    '200':
      description: Successful login
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/auth.yaml#/AuthTokenResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '429':
      $ref: ../../components/responses/common.yaml#/RateLimited
