get:
  operationId: checkEmailAvailability
  tags:
  - Auth
  summary: Check email availability
  security: []
  parameters:
  - name: email
    in: path
    required: true
    schema:
      type: string
      format: email
    example: user@example.com
  responses:
    '200':
      description: Availability result
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    available:
                      type: boolean
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
