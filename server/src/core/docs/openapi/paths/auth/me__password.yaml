patch:
  operationId: updatePassword
  tags:
  - Auth - Account
  summary: Update password
  description: Changes the authenticated user's password. If the user already has a password, `passwordCurrent` must be provided.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth.yaml#/UpdatePasswordRequest
  responses:
    '200':
      description: Password updated
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '429':
      $ref: ../../components/responses/common.yaml#/RateLimited
