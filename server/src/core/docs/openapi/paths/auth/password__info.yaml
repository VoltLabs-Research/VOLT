get:
  operationId: getPasswordInfo
  tags:
  - Auth - Account
  summary: Get password info
  description: Indicates whether the user has a password set (relevant for OAuth accounts).
  responses:
    '200':
      description: Password info
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    hasPassword:
                      type: boolean
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
