post:
  operationId: signUp
  tags:
  - Auth
  summary: Sign up
  description: Registers a new user on the platform.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth.yaml#/SignUpRequest
        example:
          email: newuser@example.com
          firstName: John
          lastName: Doe
          password: myPassword123
  responses:
    '201':
      description: Account created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/auth.yaml#/AuthTokenResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '409':
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/ErrorResponse
