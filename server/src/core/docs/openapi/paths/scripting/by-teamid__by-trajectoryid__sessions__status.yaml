get:
  tags:
  - Scripting
  summary: Get scripting session status by trajectory
  description: Returns the Jupyter session status for the notebook associated with a trajectory.
  operationId: getScriptingSessionStatusByTrajectory
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TrajectoryId
  responses:
    '200':
      description: Scripting session status
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/scripting.yaml#/ScriptingSessionStatus
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
