post:
  tags:
  - Scripting
  summary: Create a Jupyter session for a trajectory
  description: Creates a new Jupyter session scoped to a specific trajectory, optionally targeting an existing notebook.
  operationId: createJupyterSession
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/TrajectoryId
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scripting.yaml#/CreateJupyterSessionRequest
  responses:
    '201':
      description: Jupyter session created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/scripting.yaml#/JupyterSession
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
