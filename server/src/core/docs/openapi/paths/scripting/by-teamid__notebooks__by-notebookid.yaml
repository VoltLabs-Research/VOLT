patch:
  tags:
  - Scripting
  summary: Update a notebook
  description: Updates the title of an existing notebook.
  operationId: updateNotebook
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/NotebookId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scripting.yaml#/UpdateNotebookRequest
  responses:
    '200':
      description: Notebook updated successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/scripting.yaml#/Notebook
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  tags:
  - Scripting
  summary: Delete a notebook
  description: Permanently deletes a notebook by its identifier.
  operationId: deleteNotebook
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/NotebookId
  responses:
    '200':
      description: Notebook deleted successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
