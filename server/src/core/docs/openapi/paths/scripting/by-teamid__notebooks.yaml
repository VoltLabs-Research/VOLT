get:
  tags:
  - Scripting
  summary: List notebooks
  description: Returns paginated notebooks for the specified team, optionally filtered by scope.
  operationId: listNotebooks
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/Page
  - name: limit
    in: query
    required: false
    description: Maximum number of items per page (1-500)
    schema:
      type: integer
      minimum: 1
      maximum: 500
  - name: scope
    in: query
    required: false
    description: Filter notebooks by scope
    schema:
      type: string
      enum:
      - all
      - general
      - trajectory
  responses:
    '200':
      description: Paginated list of notebooks
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/scripting.yaml#/PaginatedNotebooks
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  tags:
  - Scripting
  summary: Create a notebook
  description: Creates a new scripting notebook for the specified team.
  operationId: createNotebook
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/scripting.yaml#/CreateNotebookRequest
  responses:
    '201':
      description: Notebook created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/scripting.yaml#/Notebook
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
