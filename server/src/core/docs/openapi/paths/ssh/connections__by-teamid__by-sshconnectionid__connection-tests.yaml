post:
  operationId: testSSHConnectionById
  tags:
  - SSH
  summary: Test SSH connection
  description: Tests the SSH connection to verify connectivity and credentials.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: sshConnectionId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ssh.yaml#/SSHConnectionTestResult
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
