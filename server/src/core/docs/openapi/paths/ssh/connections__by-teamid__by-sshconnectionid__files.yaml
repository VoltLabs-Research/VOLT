get:
  operationId: listSSHFiles
  tags:
  - SSH
  summary: List files on SSH server
  description: Lists files and directories at the specified path on the remote SSH server.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: sshConnectionId
    in: path
    required: true
    schema:
      type: string
  - name: path
    in: query
    required: false
    description: Remote directory path to list. Defaults to home directory.
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/ssh.yaml#/SSHFile
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
