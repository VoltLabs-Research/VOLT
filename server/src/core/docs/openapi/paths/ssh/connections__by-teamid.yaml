get:
  operationId: listSSHConnectionsByTeamId
  tags:
  - SSH
  summary: List SSH connections by team
  description: Returns a paginated list of SSH connections for the specified team. Maximum 100 results per page.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 25
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/ssh.yaml#/SSHConnection
                pagination:
                  $ref: ../../components/schemas/common.yaml#/Pagination
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
post:
  operationId: createSSHConnection
  tags:
  - SSH
  summary: Create SSH connection
  description: Creates a new SSH connection for the specified team.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ssh.yaml#/CreateSSHConnectionRequest
  responses:
    '201':
      description: Successfully created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ssh.yaml#/SSHConnection
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
