get:
  operationId: getSSHConnectionById
  tags:
  - SSH
  summary: Get SSH connection by ID
  description: Returns a single SSH connection by its unique identifier.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: sshConnectionId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ssh.yaml#/SSHConnection
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
patch:
  operationId: updateSSHConnectionById
  tags:
  - SSH
  summary: Update SSH connection
  description: Updates an existing SSH connection with the provided fields.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: sshConnectionId
    in: path
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ssh.yaml#/UpdateSSHConnectionRequest
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ssh.yaml#/SSHConnection
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteSSHConnectionById
  tags:
  - SSH
  summary: Delete SSH connection
  description: Permanently deletes the specified SSH connection.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: sshConnectionId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
