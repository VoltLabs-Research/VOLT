post:
  tags:
  - Container VNC
  summary: Create a VNC session
  description: Create a new VNC session for a container. Requires container read permission.
  operationId: createContainerVncSession
  security:
  - BearerAuth: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: containerId
    in: path
    required: true
    description: The ID of the container
    schema:
      type: string
      minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/container-vnc.yaml#/CreateVncSessionRequest
  responses:
    '201':
      description: VNC session created successfully
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/container-vnc.yaml#/VncSession
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
