post:
  operationId: streamAIConversationMessage
  tags:
  - AI Conversations
  summary: Stream AI conversation message
  description: Streams the model response for a conversation message request.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/ConversationId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai.yaml#/StreamAIConversationMessageRequest
  responses:
    '200':
      description: Streaming response
      content:
        text/event-stream:
          schema:
            type: string
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
