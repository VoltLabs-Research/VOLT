get:
  operationId: listAIConversations
  tags:
  - AI Conversations
  summary: List AI conversations
  description: Returns paginated AI conversations for the authenticated user within a team.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/Page
  - $ref: ../../components/parameters/common.yaml#/Limit
  - name: includeArchived
    in: query
    required: false
    description: Whether archived conversations should be included.
    schema:
      type: boolean
  responses:
    '200':
      description: AI conversations
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/ai.yaml#/AIConversation
                pagination:
                  $ref: ../../components/schemas/common.yaml#/Pagination
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
post:
  operationId: createAIConversation
  tags:
  - AI Conversations
  summary: Create AI conversation
  description: Creates a new AI conversation and optionally seeds it with the first user message.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai.yaml#/CreateAIConversationRequest
  responses:
    '201':
      description: Conversation created
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ai.yaml#/AIConversation
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
