patch:
  operationId: updateAIConversation
  tags:
  - AI Conversations
  summary: Update AI conversation
  description: Updates AI conversation metadata.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/ConversationId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ai.yaml#/UpdateAIConversationRequest
  responses:
    '200':
      description: Conversation updated
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/ai.yaml#/AIConversation
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
delete:
  operationId: deleteAIConversation
  tags:
  - AI Conversations
  summary: Delete AI conversation
  description: Deletes an AI conversation and its messages.
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - $ref: ../../components/parameters/common.yaml#/ConversationId
  responses:
    '200':
      description: Conversation deleted
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common.yaml#/SuccessResponse
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
