get:
  tags:
  - Scripting Jupyter Proxy
  summary: Proxy GET requests to Jupyter
  description: Proxies GET requests to the underlying Jupyter notebook runtime. All sub-paths under this prefix are forwarded.
  operationId: proxyJupyterGet
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamId
  - name: runtimeNotebookId
    in: path
    required: true
    description: Runtime notebook identifier
    schema:
      type: string
      minLength: 1
  - name: access_token
    in: query
    required: true
    description: Jupyter access token for authentication
    schema:
      type: string
  responses:
    '200':
      description: Proxied Jupyter response
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '502':
      description: Bad gateway - Jupyter runtime unavailable
