post:
  operationId: generateTeamClusterInstallManifest
  tags:
  - Cluster Lifecycle
  summary: Generate install manifest
  description: Generates the install manifest consumed by a cluster daemon.
  security: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamClusterId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/team-clusters.yaml#/TeamClusterInstallManifestRequest
  responses:
    '200':
      description: Install manifest
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    manifest:
                      $ref: ../../components/schemas/team-clusters.yaml#/TeamClusterInstallManifest
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
