post:
  operationId: recordTeamClusterHeartbeat
  tags:
  - Cluster Lifecycle
  summary: Record cluster heartbeat
  description: Records a daemon heartbeat and optional metrics snapshot.
  security: []
  parameters:
  - $ref: ../../components/parameters/common.yaml#/TeamClusterId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/team-clusters.yaml#/TeamClusterHeartbeatRequest
  responses:
    '200':
      description: Heartbeat recorded
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    teamCluster:
                      $ref: ../../components/schemas/common.yaml#/TeamCluster
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
