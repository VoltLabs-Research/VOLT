get:
  operationId: getSimulationCellById
  tags:
  - SimulationCells
  summary: Get simulation cell by ID
  description: Returns a single simulation cell by its unique identifier.
  parameters:
  - name: teamId
    in: path
    required: true
    schema:
      type: string
  - name: simulationCellId
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            allOf:
            - $ref: ../../components/schemas/common.yaml#/SuccessResponse
            - type: object
              properties:
                data:
                  $ref: ../../components/schemas/simulation-cells.yaml#/SimulationCell
    '400':
      $ref: ../../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../../components/responses/common.yaml#/Forbidden
    '404':
      $ref: ../../components/responses/common.yaml#/NotFound
