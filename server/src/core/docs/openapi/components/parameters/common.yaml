TeamId:
  name: teamId
  in: path
  required: true
  description: Team ID (MongoDB ObjectId)
  schema:
    type: string
    pattern: ^[a-fA-F0-9]{24}$
  example: 507f1f77bcf86cd799439011
SessionId:
  name: sessionId
  in: path
  required: true
  description: Session ID (MongoDB ObjectId)
  schema:
    type: string
    pattern: ^[a-fA-F0-9]{24}$
Page:
  name: page
  in: query
  description: Page number (1-indexed)
  schema:
    type: integer
    minimum: 1
    default: 1
Limit:
  name: limit
  in: query
  description: Items per page
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
Search:
  name: search
  in: query
  description: Search term
  schema:
    type: string
    minLength: 1
