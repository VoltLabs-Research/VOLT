BadRequest:
  description: Invalid input data
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      example:
        status: error
        code: Validation::Error
        message: Invalid input data
        statusCode: 400
Unauthorized:
  description: Not authenticated or invalid token
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      example:
        status: error
        code: Auth::Token::Invalid
        message: Auth::Token::Invalid
        statusCode: 401
Forbidden:
  description: Insufficient permissions
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      example:
        status: error
        code: RBAC::InsufficientPermissions
        message: 'Missing permission: team:update'
        statusCode: 403
NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      example:
        status: error
        code: Resource::NotFound
        message: Resource not found
        statusCode: 404
RateLimited:
  description: Too many requests
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      example:
        status: error
        message: Too many requests, please try again later
        statusCode: 429
