DailyActivity:
  type: object
  required:
  - date
  - activeUsers
  - totalActions
  - breakdown
  properties:
    date:
      type: string
      format: date
      description: The date this activity summary covers.
    activeUsers:
      type: integer
      description: Number of unique active users on this date.
    totalActions:
      type: integer
      description: Total number of actions performed on this date.
    breakdown:
      type: object
      description: Action counts broken down by module.
      additionalProperties:
        type: integer
      example:
        trajectories: 45
        latex: 120
        whiteboards: 30
        ssh: 10
