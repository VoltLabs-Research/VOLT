ParticleFilterProperty:
  type: object
  required:
  - name
  - type
  properties:
    name:
      type: string
      description: Name of the property available for filtering
    type:
      type: string
      description: Data type of the property (e.g., numeric, categorical)
    values:
      type:
      - array
      - 'null'
      description: Possible values for categorical properties
      items:
        oneOf:
        - type: string
        - type: number
ParticleFilterModel:
  type: object
  required:
  - filters
  properties:
    filters:
      type: array
      description: Array of filter conditions applied to the trajectory
      items:
        type: object
        required:
        - property
        - operator
        - value
        properties:
          property:
            type: string
            description: Property name being filtered
          operator:
            type: string
            description: Comparison operator (e.g., eq, neq, gt, lt, gte, lte, in)
          value:
            oneOf:
            - type: string
            - type: number
            - type: array
              items:
                oneOf:
                - type: string
                - type: number
            description: Value or values to compare against
ParticleFilterPreview:
  type: object
  required:
  - matchCount
  - totalCount
  - matchPercentage
  properties:
    matchCount:
      type: integer
      description: Number of particles matching the filter criteria
    totalCount:
      type: integer
      description: Total number of particles in the trajectory
    matchPercentage:
      type: number
      format: float
      description: Percentage of particles matching the filter (0-100)
