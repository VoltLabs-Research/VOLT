LatexDocument:
  type: object
  required:
  - _id
  - teamId
  - name
  - createdAt
  - updatedAt
  properties:
    _id:
      type: string
      description: Unique identifier of the LaTeX document.
    teamId:
      type: string
      description: ID of the team that owns this document.
    name:
      type: string
      description: Display name of the document.
    folderId:
      type:
      - string
      - 'null'
      description: ID of the folder containing this document, or null if at root.
    entrypoint:
      type:
      - string
      - 'null'
      description: ID of the file designated as the compilation entrypoint.
    compiledPdfUrl:
      type:
      - string
      - 'null'
      format: uri
      description: URL of the most recently compiled PDF, or null if not yet compiled.
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the document was created.
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the document was last updated.
LatexFile:
  type: object
  required:
  - _id
  - documentId
  - name
  - content
  - isEntrypoint
  properties:
    _id:
      type: string
      description: Unique identifier of the LaTeX file.
    documentId:
      type: string
      description: ID of the parent LaTeX document.
    name:
      type: string
      description: File name including extension.
    content:
      type: string
      description: Full text content of the file.
    isEntrypoint:
      type: boolean
      description: Whether this file is the compilation entrypoint.
LatexAsset:
  type: object
  required:
  - _id
  - documentId
  - originalName
  - path
  - url
  - size
  - mimetype
  - createdAt
  properties:
    _id:
      type: string
      description: Unique identifier of the asset.
    documentId:
      type: string
      description: ID of the parent LaTeX document.
    originalName:
      type: string
      description: Original file name of the asset.
    path:
      type: string
      description: Relative path of the asset inside the document.
    url:
      type: string
      format: uri
      description: URL to access the asset.
    size:
      type: integer
      format: int64
      description: Size of the asset in bytes.
    mimetype:
      type: string
      description: MIME type of the asset.
    createdAt:
      type: string
      format: date-time
