CreateContainerRequest:
  type: object
  required:
  - name
  - image
  properties:
    name:
      type: string
      minLength: 1
      description: The name of the container
    image:
      type: string
      minLength: 1
      description: The Docker image to use
    teamClusterId:
      type: string
      minLength: 1
      description: The ID of the team cluster to deploy to
    folderId:
      type:
      - string
      - 'null'
      minLength: 1
      description: The ID of the folder to place the container in, or null for root
    env:
      type: array
      items:
        $ref: containers.yaml#/EnvironmentVariable
      description: Environment variables to set in the container
    ports:
      type: array
      items:
        $ref: containers.yaml#/PortMapping
      description: Port mappings for the container
    cmd:
      type: array
      items:
        type: string
      description: Command to run in the container
    memory:
      type: number
      exclusiveMinimum: 0
      description: Memory limit in bytes
    cpus:
      type: number
      exclusiveMinimum: 0
      description: CPU limit
    mountDockerSocket:
      type: boolean
      description: Whether to mount the Docker socket inside the container
    useImageCmd:
      type: boolean
      description: Whether to use the default command from the image
  additionalProperties: false
UpdateContainerRequest:
  type: object
  properties:
    action:
      type: string
      enum:
      - start
      - stop
      - restart
      description: Action to perform on the container
    env:
      type: array
      items:
        $ref: containers.yaml#/EnvironmentVariable
      description: Updated environment variables
    ports:
      type: array
      items:
        $ref: containers.yaml#/PortMapping
      description: Updated port mappings
  additionalProperties: false
MoveContainerRequest:
  type: object
  required:
  - folderId
  properties:
    folderId:
      type:
      - string
      - 'null'
      description: The ID of the destination folder, or null to move to root
  additionalProperties: false
CreateFolderRequest:
  type: object
  required:
  - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
      description: The title of the folder
    parentId:
      type:
      - string
      - 'null'
      minLength: 1
      description: The ID of the parent folder, or null for root level
  additionalProperties: false
UpdateFolderRequest:
  type: object
  required:
  - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
      description: The new title of the folder
  additionalProperties: false
EnvironmentVariable:
  type: object
  required:
  - key
  - value
  properties:
    key:
      type: string
      minLength: 1
      description: The environment variable name
    value:
      type: string
      description: The environment variable value
  additionalProperties: false
PortMapping:
  type: object
  required:
  - private
  properties:
    private:
      type: integer
      minimum: 1
      maximum: 65535
      description: The private (container) port
    public:
      type: integer
      minimum: 1
      maximum: 65535
      description: The public Volt Server port. Omit or set to 0 for auto-assignment from the configured container proxy range.
  additionalProperties: false
Container:
  type: object
  description: A container instance within a team
  properties:
    id:
      type: string
    teamId:
      type: string
    name:
      type: string
    image:
      type: string
    status:
      type: string
    folderId:
      type:
      - string
      - 'null'
    env:
      type: array
      items:
        $ref: containers.yaml#/EnvironmentVariable
    ports:
      type: array
      items:
        $ref: containers.yaml#/PortMapping
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
ContainerFolder:
  allOf:
  - $ref: common.yaml#/Folder
  - type: object
    description: A folder used to organize containers
ContainerFile:
  type: object
  description: A file or directory entry inside a container
  properties:
    name:
      type: string
    path:
      type: string
    size:
      type: integer
    isDirectory:
      type: boolean
    modifiedAt:
      type: string
      format: date-time
ContainerFileContent:
  type: object
  description: The content of a file inside a container
  properties:
    path:
      type: string
    content:
      type: string
    size:
      type: integer
ContainerProcess:
  type: object
  description: A running process inside a container
  properties:
    pid:
      type: integer
    name:
      type: string
    cmd:
      type: string
    cpu:
      type: number
    memory:
      type: number
ContainerStats:
  type: object
  description: Resource usage statistics for a container
  properties:
    cpuUsage:
      type: number
    memoryUsage:
      type: integer
    memoryLimit:
      type: integer
    networkRx:
      type: integer
    networkTx:
      type: integer
