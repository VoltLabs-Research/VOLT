SignInRequest:
  type: object
  required:
  - email
  - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 1
SignUpRequest:
  type: object
  required:
  - email
  - firstName
  - lastName
  - password
  properties:
    email:
      type: string
      format: email
    firstName:
      type: string
      minLength: 1
      maxLength: 64
    lastName:
      type: string
      minLength: 1
      maxLength: 64
    password:
      type: string
      minLength: 8
UpdatePasswordRequest:
  type: object
  required:
  - password
  properties:
    passwordCurrent:
      type: string
      minLength: 1
      description: Required if the user already has a password set.
    password:
      type: string
      minLength: 8
      description: New password.
AuthTokenResponse:
  type: object
  properties:
    token:
      type: string
      description: Authentication JWT
      example: eyJhbGciOiJIUzI1NiIs...
    user:
      $ref: common.yaml#/User
