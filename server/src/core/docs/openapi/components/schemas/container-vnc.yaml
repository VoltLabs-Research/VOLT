CreateVncSessionRequest:
  type: object
  required:
  - password
  - parentOrigin
  properties:
    password:
      type: string
      minLength: 1
      description: The VNC password for the session
    parentOrigin:
      type: string
      format: uri
      description: HTTP(S) origin of the parent window
    width:
      type: integer
      minimum: 1
      maximum: 8192
      description: Display width in pixels
    height:
      type: integer
      minimum: 1
      maximum: 4320
      description: Display height in pixels
    dpi:
      type: integer
      minimum: 1
      maximum: 300
      description: Display DPI
  additionalProperties: false
VncSession:
  type: object
  description: A VNC session for a container
  properties:
    token:
      type: string
      description: Session token used to connect to the VNC session
    connectUrl:
      type: string
      description: URL to open the VNC connect page
