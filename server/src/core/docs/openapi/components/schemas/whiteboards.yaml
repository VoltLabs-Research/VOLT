Whiteboard:
  type: object
  required:
  - _id
  - teamId
  - name
  - createdBy
  - createdAt
  - updatedAt
  properties:
    _id:
      type: string
      description: Unique identifier of the whiteboard.
    teamId:
      type: string
      description: ID of the team that owns this whiteboard.
    name:
      type: string
      description: Display name of the whiteboard.
    folderId:
      type:
      - string
      - 'null'
      description: ID of the folder containing this whiteboard, or null if at root.
    createdBy:
      type: string
      description: ID of the user who created the whiteboard.
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the whiteboard was created.
    updatedAt:
      type: string
      format: date-time
      description: Timestamp when the whiteboard was last updated.
WhiteboardState:
  type: object
  properties:
    data:
      description: Opaque drawing state object. Structure depends on the whiteboard client implementation.
  description: The full drawing state of a whiteboard. May be up to 10MB.
