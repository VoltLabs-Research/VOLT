openapi: 3.1.0
info:
  title: Volt API
  version: 1.0.0
  description: |
    Volt server REST API.

    ## Authentication

    The API supports two authentication methods:

    - **JWT Bearer Token**: Obtained by signing in or via OAuth. Send as `Authorization: Bearer <token>`.
    - **Secret API Key**: Keys prefixed with `vsk_` tied to a team with specific permissions. Send as `Authorization: Bearer vsk_<key>`.

    ## Authorization (RBAC)

    Team-scoped endpoints (`/:teamId`) require:
    1. Valid authentication.
    2. Active team membership.
    3. Matching RBAC permission (`resource:action`).

    **System roles**: Owner (`*`), Admin, Member, Viewer.

    ## Response format

    All responses follow a standardized format (see `SuccessResponse`, `PaginatedResponse`, `ErrorResponse` schemas).
  contact:
    name: Volt Team
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: Local development
  - url: '{protocol}://{host}'
    description: Custom
    variables:
      protocol:
        default: https
        enum:
          - http
          - https
      host:
        default: localhost:8000
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Authentication, registration, OAuth and account management.
  - name: Auth - OAuth
    description: Login flows with external providers (GitHub, Google, Microsoft).
  - name: Auth - Account
    description: Authenticated user account management.
  - name: Sessions
    description: Active session management for the authenticated user.
  - name: Teams
    description: Team management.
  - name: Teams - Self
    description: Authenticated user permissions and membership within a team.
  - name: AI Conversations
    description: AI conversations within a team.
  - name: Analysis
    description: Trajectory analysis.
  - name: Containers
    description: Docker container management.
  - name: Trajectories
    description: Molecular trajectory management.
  - name: Plugins
    description: Plugin management and executions.
  - name: Chat
    description: Direct and group chat between members.
  - name: Notifications
    description: User notifications.
  - name: LaTeX
    description: LaTeX documents and compilation.
  - name: Scripting
    description: Notebooks and Jupyter sessions.
  - name: System
    description: System statistics and RBAC configuration.
  - name: Chat Messages
    description: Messages, reactions and file uploads for chats.
  - name: Container VNC
    description: VNC sessions and browser connection pages for containers.
  - name: ColorCoding
    description: Trajectory color coding models, properties and statistics.
  - name: ParticleFilter
    description: Trajectory particle filters, previews and available properties.
  - name: Plugin Listings
    description: Plugin listing rows and exports for analyses and trajectories.
  - name: Plugin Exposures
    description: Plugin exposure assets and exports.
  - name: Raster
    description: Rasterized trajectory jobs, metadata and frame images.
  - name: SimulationCells
    description: Simulation cell metadata for trajectories.
  - name: Whiteboards
    description: Collaborative whiteboards, folders, state and assets.
  - name: DailyActivity
    description: Daily team activity summaries.
  - name: Jobs
    description: Team job maintenance and retries.
  - name: Scripting Jupyter Proxy
    description: HTTP proxy endpoints forwarded to notebook runtimes.
  - name: Team Members
    description: Team member listing, access updates and removal.
  - name: Team Roles
    description: Custom team role management.
  - name: Team Invitations
    description: Team invitation delivery, review and acceptance.
  - name: Secret Keys
    description: Team-scoped API secret keys and usage analytics.
  - name: AI Integrations
    description: Team AI provider configuration and model availability.
  - name: Team Clusters
    description: Team cluster management, remote access and update requests.
  - name: Cluster Lifecycle
    description: Cluster daemon enrollment, lifecycle reporting and install manifests.
paths:
  /api/auth/sessions:
    post:
      operationId: signIn
      tags:
        - Auth
      summary: Sign in
      description: Authenticates a user with email and password. Returns a JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: user@example.com
              password: myPassword123
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/users:
    post:
      operationId: signUp
      tags:
        - Auth
      summary: Sign up
      description: Registers a new user on the platform.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: newuser@example.com
              firstName: John
              lastName: Doe
              password: myPassword123
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/emails/{email}/availability:
    get:
      operationId: checkEmailAvailability
      tags:
        - Auth
      summary: Check email availability
      security: []
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          example: user@example.com
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          available:
                            type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/guest-identity:
    get:
      operationId: getGuestIdentity
      tags:
        - Auth
      summary: Get guest identity
      description: Generates an identicon based on a seed for unauthenticated users.
      security: []
      parameters:
        - name: seed
          in: query
          required: true
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Guest identity generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/auth/github:
    get:
      operationId: oauthGitHub
      tags:
        - Auth - OAuth
      summary: Initiate GitHub OAuth login
      description: Redirects to GitHub authorization flow.
      security: []
      responses:
        '302':
          description: Redirect to GitHub
  /api/auth/github/callback:
    get:
      operationId: oauthGitHubCallback
      tags:
        - Auth - OAuth
      summary: GitHub OAuth callback
      description: Processes the GitHub response and issues a JWT.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client with token
  /api/auth/google:
    get:
      operationId: oauthGoogle
      tags:
        - Auth - OAuth
      summary: Initiate Google OAuth login
      security: []
      responses:
        '302':
          description: Redirect to Google
  /api/auth/google/callback:
    get:
      operationId: oauthGoogleCallback
      tags:
        - Auth - OAuth
      summary: Google OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client with token
  /api/auth/microsoft:
    get:
      operationId: oauthMicrosoft
      tags:
        - Auth - OAuth
      summary: Initiate Microsoft OAuth login
      security: []
      responses:
        '302':
          description: Redirect to Microsoft
  /api/auth/microsoft/callback:
    get:
      operationId: oauthMicrosoftCallback
      tags:
        - Auth - OAuth
      summary: Microsoft OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client with token
  /api/auth/password/info:
    get:
      operationId: getPasswordInfo
      tags:
        - Auth - Account
      summary: Get password info
      description: Indicates whether the user has a password set (relevant for OAuth accounts).
      responses:
        '200':
          description: Password info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hasPassword:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me/password:
    patch:
      operationId: updatePassword
      tags:
        - Auth - Account
      summary: Update password
      description: Changes the authenticated user's password. If the user already has a password, `passwordCurrent` must be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/me:
    get:
      operationId: getMyAccount
      tags:
        - Auth - Account
      summary: Get my account
      description: Returns the authenticated user's account data.
      responses:
        '200':
          description: Account data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMyAccount
      tags:
        - Auth - Account
      summary: Update my account
      description: Updates the authenticated user's account data. Supports avatar upload.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                  maxLength: 64
                lastName:
                  type: string
                  maxLength: 64
                fullName:
                  type: string
                  maxLength: 128
                avatar:
                  type: string
                  format: binary
                  description: Avatar image (processed with Sharp)
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteMyAccount
      tags:
        - Auth - Account
      summary: Delete my account
      description: Permanently deletes the authenticated user's account.
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sessions:
    get:
      operationId: listSessions
      tags:
        - Sessions
      summary: List active sessions
      description: Lists all active sessions for the authenticated user.
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: revokeAllSessions
      tags:
        - Sessions
      summary: Revoke all sessions
      description: Closes all active sessions for the authenticated user.
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags:
        - Sessions
      summary: Revoke a session
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/sessions/activity:
    get:
      operationId: getLoginActivity
      tags:
        - Sessions
      summary: Get login activity
      description: Login activity history for the authenticated user.
      responses:
        '200':
          description: Login activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams:
    get:
      operationId: listUserTeams
      tags:
        - Teams
      summary: List user teams
      description: Returns all teams the authenticated user is a member of.
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTeam
      tags:
        - Teams
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
            example:
              name: My Research Team
              description: Team for molecular trajectory analysis
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams/join:
    post:
      operationId: joinTeamByCode
      tags:
        - Teams
      summary: Join a team by code
      description: Join a team using a 5-character invite code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTeamRequest'
            example:
              code: AB1C2
      responses:
        '200':
          description: Successfully joined the team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{teamId}:
    get:
      operationId: getTeamById
      tags:
        - Teams
      summary: Get team by ID
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTeam
      tags:
        - Teams
      summary: Update team
      description: Updates the team name and/or description. Requires `team:update` permission.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Team'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTeam
      tags:
        - Teams
      summary: Delete team
      description: Permanently deletes the team. Requires `team:delete` permission.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{teamId}/invite-permission:
    get:
      operationId: checkInvitePermission
      tags:
        - Teams
      summary: Check invite permission
      description: Checks whether the authenticated user can invite members to the team.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Permission result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teams/{teamId}/invite-code:
    post:
      operationId: generateInviteCode
      tags:
        - Teams
      summary: Generate invite code
      description: Generates a 5-character alphanumeric code to join the team.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '201':
          description: Code generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          code:
                            type: string
                            pattern: ^[A-Z0-9]{5}$
                            example: AB1C2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteInviteCode
      tags:
        - Teams
      summary: Delete invite code
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Code deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teams/{teamId}/self/permissions:
    get:
      operationId: getMyTeamPermissions
      tags:
        - Teams - Self
      summary: Get my team permissions
      description: Returns the authenticated user's RBAC permissions within the team.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          permissions:
                            type: array
                            items:
                              type: string
                            example:
                              - trajectory:read
                              - trajectory:create
                              - container:read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teams/{teamId}/self/membership:
    delete:
      operationId: leaveTeam
      tags:
        - Teams - Self
      summary: Leave team
      description: The authenticated user leaves the team.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/chats:
    get:
      tags:
        - Chat
      summary: Get user chats
      description: Retrieve all chats for the authenticated user.
      operationId: getUserChats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user chats retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Chat'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/chats/teams/{teamId}/participants/{targetUserId}:
    post:
      tags:
        - Chat
      summary: Get or create a direct chat
      description: Retrieve an existing direct chat with a user or create a new one if it does not exist.
      operationId: getOrCreateChat
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: targetUserId
          in: path
          required: true
          description: The ID of the target user to chat with
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Direct chat retrieved or created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/chats/groups:
    post:
      tags:
        - Chat
      summary: Create a group chat
      description: Create a new group chat with specified participants.
      operationId: createGroupChat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupChatRequest'
      responses:
        '201':
          description: Group chat created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/chats/{chatId}/users:
    post:
      tags:
        - Chat
      summary: Add users to a group chat
      description: Add one or more users to an existing group chat.
      operationId: addUsersToGroupChat
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: The ID of the group chat
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUsersRequest'
      responses:
        '200':
          description: Users added to the group chat successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Chat
      summary: Remove users from a group chat
      description: Remove one or more users from an existing group chat.
      operationId: removeUsersFromGroupChat
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: The ID of the group chat
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUsersRequest'
      responses:
        '200':
          description: Users removed from the group chat successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
