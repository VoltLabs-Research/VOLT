              type: integer
              description: Frame index used for the preview
            boundingBox:
              type: object
              description: Bounding box of the molecular structure
              properties:
                min:
                  type: object
                  properties:
                    x:
                      type: number
                    'y':
                      type: number
                    z:
                      type: number
                max:
                  type: object
                  properties:
                    x:
                      type: number
                    'y':
                      type: number
                    z:
                      type: number
