      tags:
        - AI Conversations
      summary: Update AI conversation
      description: Updates AI conversation metadata.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAIConversationRequest'
      responses:
        '200':
          description: Conversation updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AIConversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAIConversation
      tags:
        - AI Conversations
      summary: Delete AI conversation
      description: Deletes an AI conversation and its messages.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{teamId}:
    get:
      operationId: listAnalysesByTeamId
      tags:
        - Analysis
      summary: List analyses
      description: Returns paginated analyses for the team.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Analyses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Analysis'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/analyses/{teamId}/trajectory/{trajectoryId}:
    get:
      operationId: listAnalysesByTrajectoryId
      tags:
        - Analysis
      summary: List trajectory analyses
      description: Returns paginated analyses for one trajectory.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/TrajectoryId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Analyses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Analysis'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{teamId}/{analysisId}:
    get:
      operationId: getAnalysisById
      tags:
        - Analysis
      summary: Get analysis
      description: Returns one analysis by identifier.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Analysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAnalysisById
      tags:
        - Analysis
      summary: Delete analysis
      description: Deletes an analysis and related derived artifacts.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Analysis deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{teamId}/{analysisId}/failed-frames/retries:
    post:
      operationId: retryAnalysisFailedFrames
      tags:
        - Analysis
      summary: Retry failed frames
      description: Retries failed jobs for an analysis.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Retry requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained by signing in or via OAuth.
        Also accepts Secret API Keys with the `vsk_` prefix.
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      description: Team ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
      example: 507f1f77bcf86cd799439011
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Search term
      schema:
        type: string
        minLength: 1
    PluginId:
      name: pluginId
      in: path
      required: true
      description: Plugin ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    TrajectoryId:
      name: trajectoryId
      in: path
      required: true
      description: Trajectory ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      description: Analysis ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    NotebookId:
      name: notebookId
      in: path
      required: true
      description: Notebook ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    TeamMemberId:
      name: teamMemberId
      in: path
      required: true
      description: Team member ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    MemberId:
      name: memberId
      in: path
      required: true
      description: Team member ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    RoleId:
      name: roleId
      in: path
      required: true
      description: Role ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    SecretKeyId:
      name: secretKeyId
      in: path
      required: true
      description: Secret key ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    TeamClusterId:
      name: teamClusterId
      in: path
      required: true
      description: Team cluster ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation ID (MongoDB ObjectId)
      schema:
        $ref: '#/components/schemas/ObjectId'
    ListingLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page (1-200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    BadRequest:
      description: Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: Validation::Error
            message: Invalid input data
            statusCode: 400
    Unauthorized:
      description: Not authenticated or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: Auth::Token::Invalid
            message: Auth::Token::Invalid
            statusCode: 401
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: RBAC::InsufficientPermissions
            message: 'Missing permission: team:update'
            statusCode: 403
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            code: Resource::NotFound
            message: Resource not found
            statusCode: 404
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Too many requests, please try again later
            statusCode: 429
  schemas:
    PaginatedResponse:
      type: object
      required:
        - status
        - data
        - pagination
      properties:
        status:
          type: string
          enum:
            - success
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
        - hasMore
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        hasMore:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      required:
        - status
        - message
        - statusCode
      properties:
        status:
          type: string
          enum:
            - error
        code:
          type: string
          description: Error code in Namespace::Error format
          example: Auth::Credentials::Invalid
        message:
          type: string
          example: Invalid credentials
        statusCode:
          type: integer
          example: 401
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    SignUpRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
          maxLength: 64
        lastName:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
    UpdatePasswordRequest:
      type: object
      required:
        - password
      properties:
        passwordCurrent:
          type: string
          minLength: 1
          description: Required if the user already has a password set.
        password:
          type: string
          minLength: 8
          description: New password.
    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Authentication JWT
          example: eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        avatar:
          type:
            - string
            - 'null'
          description: User avatar URL
        oauthProviders:
          type: array
          items:
            type: string
            enum:
              - github
              - google
              - microsoft
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      properties:
        _id:
          type: string
        userAgent:
          type: string
        ip:
          type: string
        lastActivity:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
      additionalProperties: false
    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
      additionalProperties: false
    JoinTeamRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9]{5}$
          description: 5-character uppercase alphanumeric invite code.
      additionalProperties: false
    Team:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        name:
          type: string
        description:
          type: string
        owner:
          type: string
          description: Owner user ID
        memberCount:
          type: integer
        inviteCode:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateGroupChatRequest:
      type: object
      required:
        - teamId
        - groupName
        - participantIds
      properties:
        teamId:
          type: string
          minLength: 1
          description: The ID of the team
        groupName:
          type: string
          minLength: 1
          maxLength: 100
          description: The name of the group chat
        groupDescription:
          type: string
          maxLength: 500
          description: An optional description for the group chat
        participantIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: List of user IDs to add as participants
      additionalProperties: false
    AddUsersRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: List of user IDs to add to the group
      additionalProperties: false
    RemoveUsersRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: List of user IDs to remove from the group
      additionalProperties: false
    UpdateGroupInfoRequest:
      type: object
      properties:
        groupName:
          type: string
          minLength: 1
          maxLength: 100
          description: The new name of the group chat
        groupDescription:
          type: string
          maxLength: 500
          description: The new description of the group chat
      additionalProperties: false
    UpdateGroupAdminsRequest:
      type: object
      required:
        - targetUserIds
        - action
      properties:
        targetUserIds:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: List of user IDs to grant or revoke admin privileges
        action:
          type: string
          enum:
            - add
            - remove
          description: Whether to add or remove admin privileges
      additionalProperties: false
    EditMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: The updated message content
      additionalProperties: false
    ToggleReactionRequest:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
          minLength: 1
          description: The emoji to toggle as a reaction
      additionalProperties: false
    CreateContainerRequest:
      type: object
      required:
        - name
        - image
      properties:
        name:
          type: string
          minLength: 1
          description: The name of the container
        image:
          type: string
          minLength: 1
          description: The Docker image to use
        teamClusterId:
          type: string
          minLength: 1
          description: The ID of the team cluster to deploy to
        folderId:
          type:
            - string
            - 'null'
          minLength: 1
          description: The ID of the folder to place the container in, or null for root
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
          description: Environment variables to set in the container
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortMapping'
          description: Port mappings for the container
        cmd:
          type: array
          items:
            type: string
          description: Command to run in the container
        memory:
          type: number
          exclusiveMinimum: 0
          description: Memory limit in bytes
        cpus:
          type: number
          exclusiveMinimum: 0
          description: CPU limit
        mountDockerSocket:
          type: boolean
          description: Whether to mount the Docker socket inside the container
        useImageCmd:
          type: boolean
          description: Whether to use the default command from the image
      additionalProperties: false
    UpdateContainerRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - start
            - stop
            - restart
          description: Action to perform on the container
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
          description: Updated environment variables
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortMapping'
          description: Updated port mappings
      additionalProperties: false
    MoveContainerRequest:
      type: object
      required:
        - folderId
      properties:
        folderId:
          type:
            - string
            - 'null'
          description: The ID of the destination folder, or null to move to root
      additionalProperties: false
    CreateFolderRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: The title of the folder
        parentId:
          type:
            - string
            - 'null'
          minLength: 1
          description: The ID of the parent folder, or null for root level
      additionalProperties: false
    UpdateFolderRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: The new title of the folder
      additionalProperties: false
    EnvironmentVariable:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          description: The environment variable name
        value:
          type: string
          description: The environment variable value
      additionalProperties: false
    PortMapping:
      type: object
      required:
        - private
      properties:
        private:
          type: integer
          minimum: 1
          maximum: 65535
          description: The private (container) port
        public:
          type: integer
          minimum: 1
          maximum: 65535
          description: The public Volt Server port. Omit or set to 0 for auto-assignment from the configured container proxy range.
      additionalProperties: false
    Chat:
      type: object
      description: A chat object representing either a direct or group conversation
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - direct
            - group
        groupName:
          type: string
        groupDescription:
          type: string
        participants:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              role:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatMessage:
      type: object
      description: A message within a chat conversation
      properties:
        id:
          type: string
        chatId:
          type: string
        senderId:
          type: string
        content:
          type: string
        messageType:
          type: string
          enum:
            - text
            - file
            - system
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji:
                type: string
              userIds:
                type: array
                items:
                  type: string
        isEdited:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Container:
      type: object
      description: A container instance within a team
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        image:
          type: string
        status:
          type: string
        folderId:
          type:
            - string
            - 'null'
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentVariable'
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortMapping'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContainerFolder:
      allOf:
        - $ref: '#/components/schemas/Folder'
        - type: object
          description: A folder used to organize containers
    ContainerFile:
      type: object
      description: A file or directory entry inside a container
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        isDirectory:
          type: boolean
        modifiedAt:
          type: string
          format: date-time
    ContainerFileContent:
      type: object
      description: The content of a file inside a container
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
    ContainerProcess:
      type: object
      description: A running process inside a container
      properties:
        pid:
          type: integer
        name:
          type: string
        cmd:
          type: string
        cpu:
          type: number
        memory:
          type: number
    ContainerStats:
      type: object
      description: Resource usage statistics for a container
      properties:
        cpuUsage:
          type: number
        memoryUsage:
          type: integer
        memoryLimit:
          type: integer
        networkRx:
          type: integer
        networkTx:
          type: integer
    Trajectory:
      type: object
      required:
        - _id
        - teamId
        - name
        - originalFilename
        - format
        - atomCount
        - frameCount
        - fileSize
        - status
        - uploadedBy
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique identifier of the trajectory
        teamId:
          type: string
          description: ID of the team that owns this trajectory
        name:
          type: string
          description: Display name of the trajectory
        originalFilename:
          type: string
          description: Original filename as uploaded
        format:
          type: string
          description: File format of the trajectory (e.g., pdb, xyz, gro, xtc)
        atomCount:
          type: integer
          description: Total number of atoms in the trajectory
        frameCount:
          type: integer
          description: Total number of frames (timesteps) in the trajectory
        folderId:
          type:
            - string
            - 'null'
          description: ID of the folder containing this trajectory, or null if at root level
        fileSize:
          type: integer
          format: int64
          description: Size of the trajectory file in bytes
        status:
          type: string
          enum:
            - uploading
            - processing
            - ready
            - error
          description: Current processing status of the trajectory
        uploadedBy:
          type: string
          description: ID of the user who uploaded the trajectory
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the trajectory was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the trajectory was last updated
    TrajectoryPreview:
      type: object
      required:
        - atoms
        - bonds
        - metadata
      properties:
        atoms:
          type: array
          description: Array of atom data for the preview frame
          items:
            type: object
            properties:
              index:
                type: integer
                description: Atom index
              element:
                type: string
                description: Chemical element symbol
              x:
                type: number
                format: float
                description: X coordinate
              'y':
                type: number
                format: float
                description: Y coordinate
              z:
                type: number
                format: float
                description: Z coordinate
