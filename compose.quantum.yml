# app.voltcloud.dev, run by Quantum as a stack sourced from this repository.
#
# Only static files: the landing at / and VOLT's client everywhere else, with no VOLT
# server behind them. Visitors connect the client to a server of their own or run
# VOLT in their browser. See packages/apps/client/Dockerfile.web.
#
# Quantum builds through the Docker API without BuildKit, which the client bundle
# needs, so this runs the image "Publish Stack Images" pushes to GHCR. That workflow
# notifies Quantum once the image is pushed, which is what redeploys the stack on each
# commit to main; a GitHub push webhook would arrive before the new image exists.
services:
  volt-web:
    image: ghcr.io/voltlabs-research/volt-web:${VOLT_IMAGE_TAG:-main}
    ports:
      - "5173"
